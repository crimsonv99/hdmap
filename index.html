<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>3D City Map — osm2streets + MapLibre</title>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }

    /* --- floating search bar (Google-Maps style) --- */
    #search {
      position: absolute; top: 12px; left: 12px; z-index: 5;
      display: flex; gap: 6px; align-items: center;
      background: #fff; border-radius: 24px; padding: 6px 8px 6px 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.22); width: min(360px, calc(100vw - 24px));
    }
    #search input {
      border: 0; outline: 0; flex: 1; font-size: 14px; background: transparent;
    }
    #search button {
      border: 0; background: #2f6bd6; color: #fff; width: 30px; height: 30px;
      border-radius: 50%; cursor: pointer; font-size: 15px; line-height: 1;
    }
    #search .hint { color: #9aa0aa; font-size: 11px; }

    /* --- bottom-right view controls --- */
    #controls {
      position: absolute; bottom: 26px; right: 12px; z-index: 5;
      display: flex; flex-direction: column; gap: 8px; align-items: stretch;
    }
    #controls button {
      background: #fff; border: 0; border-radius: 8px; padding: 9px 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,.22); cursor: pointer; font-size: 13px;
      color: #23303f; font-weight: 600; white-space: nowrap;
    }
    #controls button.on { background: #2f6bd6; color: #fff; }

    /* --- legend / layers card --- */
    #legend {
      position: absolute; bottom: 26px; left: 12px; z-index: 5;
      background: rgba(255,255,255,.94); border-radius: 10px; padding: 10px 12px;
      box-shadow: 0 1px 8px rgba(0,0,0,.2); font-size: 12px; color: #23303f;
      max-width: 200px;
    }
    #legend b { display: block; margin-bottom: 6px; font-size: 12px; }
    #legend label { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
    #legend .sw { width: 13px; height: 13px; border-radius: 3px; flex: none; }

    /* --- live camera readout (F4Map-style) --- */
    #readout {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 5;
      background: rgba(20,23,29,.82); color: #e7ecf3; border-radius: 8px;
      padding: 6px 11px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      box-shadow: 0 1px 6px rgba(0,0,0,.25); white-space: nowrap; pointer-events: none;
    }
    #readout b { color: #9ec5f0; font-weight: 600; }
    @media (max-width: 640px) { #readout { display: none; } }

    .maplibregl-ctrl-attrib { font-size: 10px; }

    /* --- dark-mode starfield: a static backdrop over the upper (sky) part of
       the screen. MapLibre paints the sky opaquely into the GL canvas, so stars
       can't sit *behind* it — this overlay sits on top (pointer-events:none) and
       is masked to fade out toward the horizon so it blends into the sky glow.
       Only shown when dark mode is on AND the camera is tilted (3D). --- */
    #stars {
      position: absolute; top: 0; left: 0; right: 0; height: 55%; z-index: 1;
      pointer-events: none; opacity: 0; transition: opacity .6s ease;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%);
    }
    #stars.on { opacity: 1; }
    #stars i {
      position: absolute; display: block; background: #eaf6ff; border-radius: 50%;
      box-shadow: 0 0 4px 1px rgba(180,230,255,.7);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="stars"></div>

  <div id="readout">zoom <b id="r-zoom">–</b> · tilt <b id="r-tilt">–</b>° · dir <b id="r-dir">–</b>°</div>

  <div id="search">
    <input id="goto" placeholder="Fly to  lat, lng   (e.g. 21.0369, 105.7809)" />
    <span class="hint" id="goto-hint"></span>
    <button id="goto-btn" title="Fly">➜</button>
  </div>

  <div id="controls">
    <button id="btn-3d" class="on">3D&nbsp;view</button>
    <button id="btn-dark" title="Neon night mode">🌙 Dark</button>
    <button id="btn-frame">Frame&nbsp;city</button>
    <button id="btn-north" title="Reset bearing to north">⌖ North</button>
  </div>

  <div id="legend">
    <b>Layers</b>
    <label><span class="sw" style="background:#5b6270"></span><input type="checkbox" id="t-roads" checked hidden>Roads &amp; lanes</label>
    <label><span class="sw" style="background:#ffffff;border:1px solid #ccc"></span><input type="checkbox" id="t-mark" checked hidden>Lane markings</label>
    <label><span class="sw" style="background:#d7dbe3"></span><input type="checkbox" id="t-turn" checked hidden>Turn arrows</label>
    <label><span class="sw" style="background:#bcb6a6"></span><input type="checkbox" id="t-bldg" checked hidden>Buildings (3D)</label>
    <label><span class="sw" style="background:#3aa0ff"></span><input type="checkbox" id="t-sat" hidden>Satellite base</label>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
    // ============================================================================
    // 3D City Map — MVP
    // A read-only, Google-Maps-style slippy viewer of the HD scene produced by the
    // hdmap tool (osm2streets lanes/markings + inferred 3D buildings). It loads the
    // pre-baked GeoJSON layers straight from ./data and paints them with the SAME
    // style as the editor — no server, no WASM, no editing. See README.md for the
    // PMTiles path that replaces raw GeoJSON when this needs to scale past one city.
    // ============================================================================

    // WHOLE-CITY HD layers, streamed as standard {z}/{x}/{y} vector tiles from
    // ./tiles (baked by bake-tiles + tile-join). Only the tiles under the current
    // view are fetched — this is how the whole city renders smoothly (the F4Map
    // approach). No PMTiles browser plugin: plain gzipped MVT over HTTP, the most
    // reliable MapLibre path. Each osm2streets layer is a source-layer in the tiles.
    const TILE_URL = location.origin + location.pathname.replace(/[^/]*$/, "") + "tiles/{z}/{x}/{y}.pbf";
    const META = "data/hanoi-meta.json";
    // vector source id -> source-layer name inside the tiles
    const SRC_LAYER = {
      lanes: "lanes", markings: "markings", intersections: "intersections",
      "turn-arrows": "turn_arrows", buildings: "buildings",
      water: "water", green: "green",
    };
    // bound panning to the baked city extent so you can't drift into empty tiles
    const CITY_BOUNDS = [[105.752, 20.952], [105.889, 21.108]]; // full bake bbox

    // ---- shared paint (copied verbatim from the editor so it looks identical) ---
    const LYR = ["coalesce", ["get", "layer"], 0];
    const sortKey = ["coalesce", ["get", "layer"], 0];
    const laneColor = [
      "match", ["get", "type"],
      "Driving", "#5b6270", "Parking", "#494f5b", "Sidewalk", "#8a90a0",
      "Footway", "#8a90a0", "Shoulder", "#40454f", "Biking", "#2f6b4f",
      "Bus", "#6b3a3a", "SharedLeftTurn", "#6b5f3a", "LightRail", "#5a4a6b",
      "#565c68",
    ];
    const markColor = [
      "match", ["get", "type"],
      "center line", "#e8c84a", "vehicle stop line", "#ffffff",
      "lane arrow", "#d7dbe3", "lane separator", "#c9cdd6",
      "sidewalk corner", "#8a90a0", "#ffffff",
    ];
    // daytime building tint — per-block earth tones by a hash of the way id, so
    // neighbours read as distinct. Dark mode swaps this whole expression for flat
    // neon cyan. Kept as a const so both modes reference the same source of truth.
    const bldgDayColor = [
      "match", ["%", ["to-number", ["get", "osm_way_id"], 0], 6],
      0, "#c7c0ac", 1, "#b3ac98", 2, "#c1b9a4",
      3, "#a9a28e", 4, "#cac3b0", 5, "#b8b19d", "#bcb6a6",
    ];
    const bldgNeonColor = "#00e5ff";

    // Railways (osm2streets type "LightRail") aren't routable and just confuse a
    // road map, so drop them from the surface + casing. Combine with each band's
    // layer filter.
    const notRail = ["!=", ["get", "type"], "LightRail"];
    const road = (flt) => ["all", flt, notRail];

    // roads are split into casings (drawn first) then fills (drawn after) so the
    // fills swallow every internal seam, leaving only the outer perimeter dark.
    const bandEdges = (sfx, flt) => [{
      id: "lanes-edge" + sfx, type: "line", source: "lanes", filter: road(flt),
      layout: { "line-sort-key": sortKey, "line-join": "round", "line-cap": "round" },
      paint: {
        "line-color": "#1a1e25",
        "line-width": ["interpolate", ["linear"], LYR, 0, 1.4, 1, 2.6, 4, 4.2],
      },
    }];
    const bandFills = (sfx, flt) => [
      {
        id: "lanes" + sfx, type: "fill", source: "lanes", filter: road(flt),
        layout: { "fill-sort-key": sortKey },
        paint: { "fill-color": laneColor, "fill-opacity": 1 },
      },
      {
        id: "turn-left" + sfx, type: "fill", source: "lanes",
        filter: ["all", flt, ["==", ["get", "type"], "Driving"],
          ["in", "left", ["to-string", ["get", "allowed_turns"]]]],
        layout: { "fill-sort-key": sortKey },
        paint: { "fill-color": "#2ea6a6", "fill-opacity": 0.55 },
      },
      {
        id: "turn-right" + sfx, type: "fill", source: "lanes",
        filter: ["all", flt, ["==", ["get", "type"], "Driving"],
          ["in", "right", ["to-string", ["get", "allowed_turns"]]]],
        layout: { "fill-sort-key": sortKey },
        paint: { "fill-color": "#c9772e", "fill-opacity": 0.55 },
      },
      {
        id: "markings" + sfx, type: "fill", source: "markings", filter: flt,
        minzoom: 16, // heavy layer — only paint zoomed in close, keeps panning smooth
        layout: { "fill-sort-key": sortKey },
        paint: { "fill-color": markColor, "fill-opacity": 0.9 },
      },
      {
        id: "turn-arrows" + sfx, type: "symbol", source: "turn-arrows", filter: flt,
        minzoom: 16,
        layout: {
          "icon-image": ["get", "turns"], "icon-rotate": ["get", "bearing"],
          "icon-rotation-alignment": "map",
          "icon-size": ["interpolate", ["exponential", 2], ["zoom"], 15, 0.05, 19, 0.8, 22, 6.4],
          "icon-allow-overlap": true, "icon-ignore-placement": true,
          "symbol-sort-key": sortKey,
        },
      },
    ];

    const styleLayers = [
      { id: "bg", type: "background", paint: { "background-color": "#e7ecdb" } },
      { id: "satellite", type: "raster", source: "sat", layout: { visibility: "none" } },
      // flat 2D street map for the zoomed-out view. Fades out as you cross the
      // switch zoom, where the 3D HD layers take over.
      {
        id: "basemap-2d", type: "raster", source: "basemap", maxzoom: 16,
        paint: {
          "raster-opacity": ["interpolate", ["linear"], ["zoom"], 15, 1, 15.5, 0],
        },
      },
      // dark 2D basemap — same fade, hidden until dark mode swaps it in
      {
        id: "basemap-2d-dark", type: "raster", source: "basemapDark", maxzoom: 16,
        layout: { visibility: "none" },
        paint: {
          "raster-opacity": ["interpolate", ["linear"], ["zoom"], 15, 1, 15.5, 0],
        },
      },
      // land cover under the roads — so the 3D scene isn't bare beige. Green
      // parks/forest and blue water (the flat 2D basemap supplies these below the
      // switch zoom; these are their 3D-mode counterparts, gated to z15+).
      {
        id: "green", type: "fill", source: "green",
        paint: { "fill-color": "#c6dcac", "fill-opacity": 0.9 },
      },
      {
        id: "water", type: "fill", source: "water",
        paint: { "fill-color": "#9ec6e0", "fill-opacity": 1 },
      },
      // intersection casing then fill (fuse road + junction into one surface)
      {
        id: "inter-edge", type: "line", source: "intersections",
        filter: ["!", ["in", ["get", "intersection_kind"], ["literal", ["Connection", "MapEdge"]]]],
        layout: { "line-sort-key": sortKey, "line-join": "round" },
        paint: { "line-color": "#1a1e25", "line-width": 1.4, "line-opacity": 0.9 },
      },
      ...bandEdges("", ["<", LYR, 1]),
      {
        id: "intersections", type: "fill", source: "intersections",
        filter: ["!=", ["get", "intersection_kind"], "MapEdge"],
        layout: { "fill-sort-key": sortKey },
        paint: {
          "fill-color": "#5b6270", // one continuous asphalt surface (signals shown by icon)
          "fill-opacity": 1,
        },
      },
      ...bandFills("", ["<", LYR, 1]),
      // elevated roads (bridges) on top, same casing→fill order
      ...bandEdges("-hi", [">=", LYR, 1]),
      ...bandFills("-hi", [">=", LYR, 1]),
      {
        id: "inter-signal", type: "symbol", source: "intersections",
        filter: ["==", ["get", "control"], "Signalled"], minzoom: 15,
        layout: {
          "icon-image": "traffic-signal",
          "icon-size": ["interpolate", ["exponential", 2], ["zoom"], 15, 0.16, 19, 0.8],
          "icon-allow-overlap": true, "icon-ignore-placement": true,
        },
      },
      // 3D buildings — inferred height; flat when top-down, rises once tilted.
      // Gated to z14+ so low-zoom city panning stays light (F4Map does the same:
      // buildings appear as you zoom into a neighbourhood).
      {
        id: "buildings-3d", type: "fill-extrusion", source: "buildings", minzoom: 14,
        paint: {
          "fill-extrusion-color": bldgDayColor,
          "fill-extrusion-height": ["coalesce", ["get", "height"], 6],
          "fill-extrusion-base": ["coalesce", ["get", "base"], 0],
          "fill-extrusion-opacity": 0.92,
          "fill-extrusion-vertical-gradient": true,
        },
      },
      // neon footprint outline — MapLibre has no bloom, so the "glow" is faked
      // with a bright cyan line on each building's base. Hidden until dark mode.
      {
        id: "buildings-edge", type: "line", source: "buildings", minzoom: 14,
        layout: { visibility: "none", "line-join": "round" },
        paint: {
          "line-color": "#5ffbf1",
          "line-width": ["interpolate", ["linear"], ["zoom"], 15, 0.6, 19, 2],
          "line-opacity": 0.85,
          "line-blur": 0.6,
        },
      },
    ];

    // remap each HD layer from its GeoJSON source id to the single vector source
    // + matching source-layer inside the tiles (keeps the paint block untouched)
    // The HD osm2streets layers only make sense zoomed in, so they render ONLY
    // above the 2D->3D switch zoom (SWITCH_Z). Below it, the flat street basemap
    // shows instead. (Layers with a higher minzoom, e.g. markings at 16, keep it.)
    const SWITCH_Z = 15;
    for (const L of styleLayers) {
      if (L.source && SRC_LAYER[L.source]) {
        L["source-layer"] = SRC_LAYER[L.source];
        L.source = "hd";
        L.minzoom = Math.max(SWITCH_Z, L.minzoom || 0);
      }
    }

    // sky gradients: daytime (blue) and neon nightfall (deep navy → dusky horizon)
    const DAY_SKY = {
      "sky-color": "#9ec5f0", "sky-horizon-blend": 0.6,
      "horizon-color": "#dce6ec", "horizon-fog-blend": 0.6,
      "fog-color": "#e7ecdb", "fog-ground-blend": 0.2, "atmosphere-blend": 0.5,
    };
    const NIGHT_SKY = {
      "sky-color": "#05081a", "sky-horizon-blend": 0.7,
      "horizon-color": "#141d3a", "horizon-fog-blend": 0.6,
      "fog-color": "#0a0d12", "fog-ground-blend": 0.25, "atmosphere-blend": 0.6,
    };

    const map = new maplibregl.Map({
      container: "map",
      center: [105.8520, 21.0310], // Hoan Kiem lake — dense central Hanoi
      zoom: 16,       // open in 3D HD mode (above the 2D->3D switch)
      minZoom: 12,
      maxZoom: 19,   // z17 tiles overzoom cleanly to 19; past that markings blur
      maxBounds: CITY_BOUNDS,
      pitch: 55,      // 3D by default — this is the whole point of the MVP
      bearing: -18,
      maxPitch: 80,
      hash: true,     // F4Map-style: zoom/lat/lng/bearing/pitch live in the URL
      style: {
        version: 8,
        sources: {
          sat: {
            type: "raster", tileSize: 256,
            tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
            attribution: "Imagery © Esri, Maxar, Earthstar Geographics",
          },
          // flat street map (CARTO Voyager) for the 2D zoomed-out view
          basemap: {
            type: "raster", tileSize: 256, maxzoom: 20,
            tiles: [
              "https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
              "https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
              "https://c.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
            ],
            attribution: "© OpenStreetMap contributors © CARTO",
          },
          // dark 2D basemap (CARTO Dark Matter) — the night-mode counterpart of
          // Voyager, same tile scheme, swapped in when dark mode is on.
          basemapDark: {
            type: "raster", tileSize: 256, maxzoom: 20,
            tiles: [
              "https://a.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png",
              "https://b.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png",
              "https://c.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png",
            ],
            attribution: "© OpenStreetMap contributors © CARTO",
          },
          hd: {
            type: "vector",
            tiles: [TILE_URL],
            minzoom: 15, maxzoom: 17, // HD tiles are z15-17 (2D basemap below 15)
            attribution: "© OpenStreetMap contributors · osm2streets",
          },
        },
        layers: styleLayers,
        light: { anchor: "map", color: "#ffffff", intensity: 0.4, position: [1.2, 210, 30] },
        sky: DAY_SKY,
      },
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
    map.addControl(new maplibregl.ScaleControl({ unit: "metric" }));
    map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: true }), "top-right");

    // live camera readout (zoom / tilt = pitch / dir = bearing), F4Map-style
    const rZoom = document.getElementById("r-zoom");
    const rTilt = document.getElementById("r-tilt");
    const rDir = document.getElementById("r-dir");
    const updateReadout = () => {
      rZoom.textContent = map.getZoom().toFixed(1);
      rTilt.textContent = Math.round(map.getPitch());
      rDir.textContent = ((Math.round(map.getBearing()) % 360) + 360) % 360;
    };
    map.on("move", updateReadout);
    updateReadout();

    let dataBounds = CITY_BOUNDS;
    fetch(META).then((r) => r.json()).then((m) => {
      if (m.bbox) dataBounds = [[m.bbox[0], m.bbox[1]], [m.bbox[2], m.bbox[3]]];
    }).catch(() => {});

    // ---- turn-arrow + traffic-signal icons, drawn on demand (same as editor) ----
    const makeArrowIcon = (key) => {
      const S = 64, cx = S / 2, midY = S * 0.52, baseY = S - 6, topY = 8;
      const cv = document.createElement("canvas"); cv.width = S; cv.height = S;
      const g = cv.getContext("2d");
      g.strokeStyle = "#f2f4f8"; g.fillStyle = "#f2f4f8";
      g.lineWidth = 7; g.lineCap = "round"; g.lineJoin = "round";
      const head = (x, y, ang) => {
        const dx = Math.sin(ang), dy = -Math.cos(ang), L = 15, W = 10;
        const bx = x - dx * L, by = y - dy * L, px = -dy, py = dx;
        g.beginPath(); g.moveTo(x, y);
        g.lineTo(bx + px * W, by + py * W); g.lineTo(bx - px * W, by - py * W);
        g.closePath(); g.fill();
      };
      g.beginPath(); g.moveTo(cx, baseY); g.lineTo(cx, midY); g.stroke();
      for (const d of key.split("_")) {
        if (d === "through") {
          g.beginPath(); g.moveTo(cx, midY); g.lineTo(cx, topY + 6); g.stroke(); head(cx, topY, 0);
        } else if (d === "left") {
          g.beginPath(); g.moveTo(cx, midY); g.lineTo(14, midY - 4); g.stroke(); head(8, midY - 4, -Math.PI / 2);
        } else if (d === "right") {
          g.beginPath(); g.moveTo(cx, midY); g.lineTo(S - 14, midY - 4); g.stroke(); head(S - 8, midY - 4, Math.PI / 2);
        }
      }
      return g.getImageData(0, 0, S, S);
    };
    const makeSignalIcon = () => {
      const S = 64, cv = document.createElement("canvas"); cv.width = S; cv.height = S;
      const g = cv.getContext("2d");
      const w = 26, h = 54, x = (S - w) / 2, y = (S - h) / 2, r = 9;
      g.fillStyle = "#14171d"; g.strokeStyle = "#eef1f6"; g.lineWidth = 3.5;
      g.beginPath(); g.moveTo(x + r, y);
      g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
      g.closePath(); g.fill(); g.stroke();
      const cx = S / 2, rad = 6.5;
      [["#ff5b5b", y + 13], ["#ffcf4a", y + 27], ["#4ddc7a", y + 41]].forEach(([c, cy]) => {
        g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); g.fillStyle = c; g.fill();
      });
      return g.getImageData(0, 0, S, S);
    };
    map.on("styleimagemissing", (e) => {
      if (map.hasImage(e.id)) return;
      try {
        const img = e.id === "traffic-signal" ? makeSignalIcon() : makeArrowIcon(e.id);
        map.addImage(e.id, img, { pixelRatio: 2 });
      } catch (_) {}
    });

    // ---- click a road / building for a quick info popup (read-only) ----
    map.on("load", () => {
      map.on("click", (e) => {
        const f = map.queryRenderedFeatures(e.point, {
          layers: ["buildings-3d", "lanes", "lanes-hi"],
        })[0];
        if (!f) return;
        const p = f.properties || {};
        let html;
        if (f.layer.id.startsWith("buildings")) {
          html = `<b>Building</b><br>${p.name ? p.name + "<br>" : ""}` +
            `height ≈ ${Math.round(p.height ?? 6)} m` +
            `${p.height_source ? " (" + p.height_source + ")" : ""}` +
            `${p.levels ? "<br>" + p.levels + " levels" : ""}`;
        } else {
          html = `<b>${p.type || "Road"} lane</b>` +
            `${p.width ? "<br>width ≈ " + (+p.width).toFixed(1) + " m" : ""}` +
            `${p.speed_limit ? "<br>speed " + p.speed_limit : ""}`;
        }
        new maplibregl.Popup({ closeButton: false })
          .setLngLat(e.lngLat).setHTML(html).addTo(map);
      });
      map.on("mouseenter", "buildings-3d", () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", "buildings-3d", () => (map.getCanvas().style.cursor = ""));
    });

    // ---- UI wiring ----
    const goTo = () => {
      const hint = document.getElementById("goto-hint");
      const raw = document.getElementById("goto").value.trim();
      const m = raw.match(/^(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)$/);
      if (!m) { hint.textContent = "lat, lng"; return; }
      const lat = +m[1], lng = +m[2];
      if (Math.abs(lat) > 90 || Math.abs(lng) > 180) { hint.textContent = "range"; return; }
      hint.textContent = "";
      map.flyTo({ center: [lng, lat], zoom: 18, pitch: 55, speed: 1.4 });
      new maplibregl.Marker({ color: "#2f6bd6" }).setLngLat([lng, lat]).addTo(map);
    };
    document.getElementById("goto-btn").onclick = goTo;
    document.getElementById("goto").addEventListener("keydown", (e) => e.key === "Enter" && goTo());

    // ---- auto 2D<->3D by zoom (like F4Map / Google) --------------------------
    // Below the switch zoom the map is flat 2D (street basemap); above it the
    // camera tilts into the 3D HD view. Only fires when crossing the threshold,
    // so it never fights an in-progress zoom. The 3D button is a manual override.
    const btn3d = document.getElementById("btn-3d");
    let is3d = map.getPitch() > 5;
    btn3d.classList.toggle("on", is3d);
    const setMode = (want3d, ms) => {
      if (want3d === is3d) return;
      is3d = want3d;
      btn3d.classList.toggle("on", is3d);
      map.easeTo({ pitch: is3d ? 55 : 0, duration: ms });
    };
    map.on("zoom", () => setMode(map.getZoom() > SWITCH_Z, 400));
    btn3d.onclick = () => setMode(!is3d, 500);
    document.getElementById("btn-frame").onclick = () => {
      map.fitBounds(dataBounds, { padding: 40, pitch: 0, maxZoom: 16 });
    };
    document.getElementById("btn-north").onclick = () => map.easeTo({ bearing: 0, duration: 500 });

    // ---- neon night mode -----------------------------------------------------
    // A reversible theme: gray-black ground, nightfall sky, cyan buildings with a
    // faked neon edge, and a static starfield when tilted. Pure client-side paint
    // swap — no re-bake. Day is the default; the 🌙 button flips it.
    const btnDark = document.getElementById("btn-dark");
    const starsEl = document.getElementById("stars");
    let darkOn = false;

    // build a static starfield once (no animation — "static stars" as asked).
    // Deterministic-ish sparse dots across the upper sky band.
    (function seedStars() {
      const N = 170;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < N; i++) {
        const s = document.createElement("i");
        const size = (0.6 + Math.random() * 1.7).toFixed(2);
        s.style.left = (Math.random() * 100).toFixed(2) + "%";
        s.style.top = (Math.random() * 100).toFixed(2) + "%";
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.opacity = (0.35 + Math.random() * 0.6).toFixed(2);
        frag.appendChild(s);
      }
      starsEl.appendChild(frag);
    })();

    // stars only make sense in dark mode AND when the sky fills the top of the
    // screen (camera tilted). Driven off the actual pitch so it tracks any tilt.
    const updateStars = () => starsEl.classList.toggle("on", darkOn && map.getPitch() > 8);
    map.on("pitch", updateStars);

    const applyTheme = (dark) => {
      const set = (id, prop, val) => { if (map.getLayer(id)) map.setPaintProperty(id, prop, val); };
      const vis = (id, on) => { if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); };
      // ground + land cover
      set("bg", "background-color", dark ? "#0a0d12" : "#e7ecdb");
      set("green", "fill-color", dark ? "#10241a" : "#c6dcac");
      set("water", "fill-color", dark ? "#0b1f2e" : "#9ec6e0");
      // roads/junctions: in dark they need to sit CLEARLY above the near-black
      // ground (else the ways vanish), so a mid slate-blue surface + a faint cyan
      // casing rim that ties them into the neon theme instead of receding.
      for (const id of ["lanes", "lanes-hi"]) set(id, "fill-color", dark ? "#333d4d" : laneColor);
      set("intersections", "fill-color", dark ? "#333d4d" : "#5b6270");
      for (const id of ["lanes-edge", "lanes-edge-hi", "inter-edge"])
        set(id, "line-color", dark ? "#2aa7b8" : "#1a1e25");
      // buildings: flat neon cyan (gradient off = emissive look) vs lit earth tones
      set("buildings-3d", "fill-extrusion-color", dark ? bldgNeonColor : bldgDayColor);
      set("buildings-3d", "fill-extrusion-vertical-gradient", !dark);
      set("buildings-3d", "fill-extrusion-opacity", dark ? 0.96 : 0.92);
      vis("buildings-edge", dark);
      // 2D basemap swap (below the switch zoom)
      vis("basemap-2d", !dark);
      vis("basemap-2d-dark", dark);
      // sky + light: flatten the sun in dark so cyan walls read uniform, not lit
      map.setSky(dark ? NIGHT_SKY : DAY_SKY);
      map.setLight(dark
        ? { anchor: "map", color: "#bfefff", intensity: 0.85, position: [1.2, 210, 30] }
        : { anchor: "map", color: "#ffffff", intensity: 0.4, position: [1.2, 210, 30] });
      updateStars();
    };

    btnDark.onclick = () => {
      darkOn = !darkOn;
      btnDark.classList.toggle("on", darkOn);
      btnDark.innerHTML = darkOn ? "☀️ Day" : "🌙 Dark";
      applyTheme(darkOn);
    };

    // layer toggles
    const toggle = (id, ...layers) => {
      const cb = document.getElementById(id);
      cb.parentElement.addEventListener("click", () => {
        cb.checked = !cb.checked;
        const v = cb.checked ? "visible" : "none";
        layers.forEach((l) => map.getLayer(l) && map.setLayoutProperty(l, "visibility", v));
      });
    };
    map.on("load", () => {
      toggle("t-roads", "lanes", "lanes-edge", "lanes-hi", "lanes-edge-hi", "intersections", "inter-edge");
      toggle("t-mark", "markings", "markings-hi");
      toggle("t-turn", "turn-left", "turn-right", "turn-arrows", "turn-left-hi", "turn-right-hi", "turn-arrows-hi");
      toggle("t-bldg", "buildings-3d");
      // satellite base toggle
      const sat = document.getElementById("t-sat");
      sat.parentElement.addEventListener("click", () => {
        sat.checked = !sat.checked;
        map.setLayoutProperty("satellite", "visibility", sat.checked ? "visible" : "none");
      });
    });
  </script>
</body>
</html>
