      if (!map.getLayer("nav-route-core")) return;
      // dark = neon yellow-gold (stands out against the cyan buildings); day = blue.
      // Kept semi-transparent so the lane highlight leads (it's a preview underlay).
      map.setPaintProperty("nav-route-core", "line-color", dark ? "#ffe14d" : "#2f6bd6");
      map.setPaintProperty("nav-route-core", "line-blur", dark ? 0.6 : 0);
      map.setPaintProperty("nav-route-core", "line-opacity", dark ? 0.7 : 0.55);
      map.setPaintProperty("nav-route-casing", "line-color", dark ? "#ffc21e" : "#0f2145");
      map.setPaintProperty("nav-route-casing", "line-blur", dark ? 5 : 0.4);
      map.setPaintProperty("nav-route-casing", "line-opacity", 0.4);
    };
    const ensureRouteLayer = () => {
      if (map.getSource("nav-route")) return;
      // lane-guide: highlights the real HD driving-lane polygons under the car
      // during the 3D drive (Task 11). Sits just below buildings, above the lanes.
      map.addSource("lane-guide", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({
        id: "lane-guide", type: "fill", source: "lane-guide",
        paint: { "fill-color": "#25e07d", "fill-opacity": 0.5, "fill-outline-color": "#0c7a3d" },
      }, map.getLayer("buildings-3d") ? "buildings-3d" : undefined);
      map.addSource("nav-route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      const casingW = ["interpolate", ["linear"], ["zoom"], 12, 5, 16, 11, 19, 20];
      const coreW = ["interpolate", ["linear"], ["zoom"], 12, 2, 16, 6, 19, 12];
      map.addLayer({
        id: "nav-route-casing", type: "line", source: "nav-route",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#0f2145", "line-width": casingW, "line-opacity": 0.95, "line-blur": 0.4 },
      });
      map.addLayer({
        id: "nav-route-core", type: "line", source: "nav-route",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#2f6bd6", "line-width": coreW, "line-opacity": 1 },
      });
      // yellow overlay for the immediate upcoming-turn stretch (drive mode only),
      // sits ON TOP of the blue core — like the Hudhud/Google turn highlight
      map.addSource("nav-turn", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({
        id: "nav-turn", type: "line", source: "nav-turn",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#f5c518", "line-width": coreW, "line-opacity": 1 },
      });
      styleRoute(darkOn); // match the current theme if route is created while dark
    };
    const emptyFC = { type: "FeatureCollection", features: [] };
    const clearRoute = () => {
      if (map.getSource("nav-route")) map.getSource("nav-route").setData(emptyFC);
      if (map.getSource("nav-turn")) map.getSource("nav-turn").setData(emptyFC);
      for (const id of ["nav-route-core", "nav-route-casing", "nav-turn"]) // restore flat visibility
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "visible");
      // the 3D ribbon is a custom WebGL layer — clearing its meshes doesn't auto-
      // repaint (unlike a geojson setData), so force one or the last frame lingers.
      if (typeof driveRouteLayer !== "undefined" && driveRouteLayer.scene) { driveRouteLayer.clear(); map.triggerRepaint(); }
    };

    // full teardown: pins, route line, summary card, hint back to step 1
    const resetNav = () => {
      NAV.clearPoints(); clearRoute();
      NAV.lastRoute = null; // forget the route, else a later 2D/3D toggle redraws it
      navSummary.classList.remove("on");
      navPanel.classList.remove("on"); navStepsBtn.classList.remove("on");
      setHint();
    };

    const showSummary = (r) => {
      navSummary.innerHTML =
        `🚗 <span class="dist">${fmtDist(r.distM)}</span>` +
        `<span class="sep">·</span> ~${fmtDur(r.timeS)}` +
        `<span class="clear" title="Clear route">✕</span>`;
      navSummary.classList.add("on");
      navSummary.querySelector(".clear").onclick = resetNav;
    };

    // --- directions panel (Task 9): turn-by-turn list + summary, toggleable ---
    const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const TURN_GLYPH = { depart: "●", straight: "↑", continue: "↑", left: "↰", "slight-left": "↖",
      "sharp-left": "↰", right: "↱", "slight-right": "↗", "sharp-right": "↱", uturn: "↩", arrive: "🏁" };
    const viaRoad = (mans) => { let b = null, bd = -1; for (const m of mans) if (m.name && m.dist > bd) { bd = m.dist; b = m.name; } return b; };
    const clockAfter = (sec) => new Date(Date.now() + sec * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    const togglePanel = (show) => {
      navPanel.classList.toggle("on", show);
      navStepsBtn.classList.toggle("on", !show && NAV.points.length >= 2);
    };
    navStepsBtn.onclick = () => togglePanel(true);

    const swapAB = () => {
      if (NAV.points.length < 2) return;
      NAV.points.reverse();
      NAV.points.forEach((p, i) => {
        p.marker.remove();
        p.marker = new maplibregl.Marker({ element: makePin(i === 0 ? "A" : "B"), anchor: "bottom" })
          .setLngLat([p.snap.lng, p.snap.lat]).addTo(map);
      });
      computeRoute();
    };

    const renderPanel = (r) => {
      const aName = NAV.edgeName(NAV.points[0].snap.e) || "Start point";
      const bName = NAV.edgeName(NAV.points[1].snap.e) || "Destination";
      const via = viaRoad(r.maneuvers);
      const steps = r.maneuvers.map((m) => {
        const arr = m.turn === "arrive";
        return `<div class="step${arr ? " arrive" : ""}"><div class="ic">${TURN_GLYPH[m.turn] || "↑"}</div>` +
          `<div class="tx">${escapeHtml(m.instruction)}${m.dist ? `<div class="ds">${fmtDist(m.dist)}</div>` : ""}</div></div>`;
      }).join("");
      navPanel.innerHTML =
        `<div class="np-head"><button class="np-hide" title="Hide directions">‹</button>` +
          `<div class="np-eta">${fmtDur(r.timeS)}<small>(${fmtDist(r.distM)})</small></div>` +
          `${via ? `<div class="np-sub">via ${escapeHtml(via)}</div>` : ""}` +
          `<div class="np-sub">Arrive ~${clockAfter(r.timeS)}</div>` +
          `<button class="np-go">▶ GO — drive in ${is3d ? "3D" : "2D"}</button></div>` +
        `<div class="np-od">` +
          `<div class="row"><span class="dot a"></span><span class="name">${escapeHtml(aName)}</span>` +
            `<button class="np-swap" title="Swap start / destination">⇅</button></div>` +
          `<div class="row"><span class="dot b"></span><span class="name">${escapeHtml(bName)}</span></div></div>` +
        `<div class="np-steps">${steps}</div>`;
      navPanel.querySelector(".np-hide").onclick = () => togglePanel(false);
      navPanel.querySelector(".np-swap").onclick = swapAB;
      navPanel.querySelector(".np-go").onclick = () => startDrive(r);
      togglePanel(true);
    };

    // frame the whole route on a flat (2D) map, leaving room for the left panel
    const fitRoute = (coords) => {
      let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
      for (const [x, y] of coords) { if (x < minx) minx = x; if (y < miny) miny = y; if (x > maxx) maxx = x; if (y > maxy) maxy = y; }
      map.fitBounds([[minx, miny], [maxx, maxy]], { padding: { top: 90, bottom: 130, left: 360, right: 60 }, pitch: map.getPitch(), duration: 700, maxZoom: 16 });
    };

    // ================= 3D DRIVE MODE (Task 10) =================
    // Follow-cam along the route: car marker + maneuver banner (next turn +
    // distance + road) + simulated speed (from the current road's effective
    // speed) + bottom bar (remaining dist/time + arrival clock). Play/pause/exit.
    const driveUI = document.getElementById("drive-ui");
    const dBanner = document.getElementById("drive-banner");
    const dSpeedEl = document.querySelector("#drive-speed .cur b");
    const dLimitEl = document.querySelector("#drive-speed .limit b");
    const dBottom = document.getElementById("drive-bottom");
    // PLAYBACK = time compression (1 = real time). TURN_EASE = camera-bearing glide.
    // Per-mode camera: 3D sits close behind the car; 2D is a tighter top-down chase.
    const PLAYBACK = 1.0, TURN_EASE = 2.5;
    const DRIVE_VIEW = { "3d": { pitch: 62, zoom: 19, look: 22 }, "2d": { pitch: 0, zoom: 17.8, look: 0 } };
    // Turn slowdown: within TURN_SLOW_M of a real turn, ease the car down to
    // TURN_SLOW_MIN of road speed so corners don't whip past.
    const TURN_SLOW_M = 35, TURN_SLOW_MIN = 0.3;
    // The route rides the OSM centerline (between both directions). Shift the driven
    // path to the RIGHT of travel so the car sits in its own lane, not on the median
    // — Vietnam drives on the right. ~a lane and a half off centre reads well.
    const LANE_OFFSET_M = 2.5;

    const metersBetween = (a, b) => {
      const R = 6371000, rad = Math.PI / 180;
      const dLat = (b[1] - a[1]) * rad, dLng = (b[0] - a[0]) * rad;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    };
    const moveAlong = ([lng, lat], headingDeg, distM) => {
      const rad = Math.PI / 180;
      return [lng + (distM * Math.sin(headingDeg * rad)) / (111320 * Math.cos(lat * rad)),
              lat + (distM * Math.cos(headingDeg * rad)) / 111320];
    };
    // Shift a polyline `distM` to the RIGHT of its travel direction so the driven
    // path sits in the right-hand lane rather than on the centerline. Uses a MITER
    // join at each vertex: the offset direction is the bisector of the two adjacent
    // segment normals and the distance is d/cos(halfBend) — the exact point where the
    // two offset edges meet. A naive fixed-distance per-vertex offset instead pulls
    // sharp inside corners short of that meeting point, so the offset edges cross and
    // the path folds into a hook (visible as a kink in the route/turn band and a jink
    // in the car at ramps). The miter length is capped so near-hairpins don't spike.
    const offsetRight = (coords, distM) => {
      const n = coords.length;
      if (!distM || n < 2) return coords;
      const segBr = [];
      for (let i = 0; i < n - 1; i++) segBr.push(bearingDeg(coords[i], coords[i + 1]));
      return coords.map((c, i) => {
        let dir, mag = distM;
        if (i === 0) dir = segBr[0] + 90;
        else if (i === n - 1) dir = segBr[n - 2] + 90;
        else {
          const b1 = segBr[i - 1], b2 = segBr[i];
          const delta = ((b2 - b1 + 540) % 360) - 180;   // signed turn, -180..180
          const cosH = Math.cos(Math.abs(delta) * 0.5 * Math.PI / 180);
          mag = distM * Math.min(cosH > 0.26 ? 1 / cosH : 3.8, 3.8); // miter length, capped
          dir = b1 + delta / 2 + 90;                       // bisector normal (to the right)
        }
        return moveAlong(c, dir, mag);
      });
    };
    // ---- true-3D car (three.js) ------------------------------------------------
    // A real volumetric mesh rendered INTO MapLibre's GL context via a custom layer,
    // so it pitches with the camera, depth-tests against the 3D buildings, scales in
    // real metres, and is lit by three.js lights. Built procedurally (no external
    // model file) so it stays self-contained; swap in a glTF later if desired.
    // Local frame: metres, Y-up, car FORWARD = +Z, wheels on the ground plane (y≈0).
    const buildCarMesh = () => {
      const g = new THREE.Group();
      const paint = new THREE.MeshStandardMaterial({ color: 0xd8261f, metalness: 0.45, roughness: 0.42 });
      const glass = new THREE.MeshStandardMaterial({ color: 0x151b26, metalness: 0.3, roughness: 0.15 });
      const trim  = new THREE.MeshStandardMaterial({ color: 0x111318, metalness: 0.5, roughness: 0.6 });
      const tyre  = new THREE.MeshStandardMaterial({ color: 0x0d0d10, metalness: 0.1, roughness: 0.9 });
      const lamp  = new THREE.MeshStandardMaterial({ color: 0xfff4c2, emissive: 0xffe89a, emissiveIntensity: 0.9, roughness: 0.3 });
      const rearL = new THREE.MeshStandardMaterial({ color: 0xd23a3a, emissive: 0x7a1414, emissiveIntensity: 0.7, roughness: 0.4 });
      const box = (w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return m; };

      const L = 4.2, W = 1.85, wheelR = 0.34;
      // lower body (chassis) — sits just above the wheels
      g.add(box(W, 0.55, L, paint, 0, wheelR + 0.30, 0));
      // slightly narrower sill/skirt so the body reads rounded, not a single brick
      g.add(box(W - 0.12, 0.30, L - 0.2, paint, 0, wheelR + 0.10, 0));
      // cabin/greenhouse — shorter, set back a touch, dark glass
      g.add(box(W - 0.24, 0.5, L * 0.44, glass, 0, wheelR + 0.78, -0.15));
      // roof cap (body colour) over the glass
      g.add(box(W - 0.30, 0.10, L * 0.40, paint, 0, wheelR + 1.02, -0.15));
      // headlights (front = +Z) and tail lights (rear = -Z)
      g.add(box(0.34, 0.16, 0.06, lamp, +0.55, wheelR + 0.34, L / 2 - 0.02));
      g.add(box(0.34, 0.16, 0.06, lamp, -0.55, wheelR + 0.34, L / 2 - 0.02));
      g.add(box(0.34, 0.14, 0.06, rearL, +0.55, wheelR + 0.40, -L / 2 + 0.02));
      g.add(box(0.34, 0.14, 0.06, rearL, -0.55, wheelR + 0.40, -L / 2 + 0.02));
      // wheels — cylinders with axle along X (across the car)
      const wheelGeo = new THREE.CylinderGeometry(wheelR, wheelR, 0.26, 20);
      for (const [x, z] of [[ (W/2)-0.02, L/2 - 1.1], [ -(W/2)+0.02, L/2 - 1.1], [ (W/2)-0.02, -L/2 + 1.05], [ -(W/2)+0.02, -L/2 + 1.05]]) {
        const wm = new THREE.Mesh(wheelGeo, tyre);
        wm.rotation.z = Math.PI / 2; // stand the cylinder up as a wheel (axle → X)
        wm.position.set(x, wheelR, z);
        g.add(wm);
      }
      // soft fake shadow on the ground (MapLibre extrusions can't cast real ones):
      // a radial-gradient plane laid flat under the car, so it reads as grounded.
      const cvs = document.createElement("canvas"); cvs.width = cvs.height = 128;
      const cx = cvs.getContext("2d");
      const grd = cx.createRadialGradient(64, 64, 6, 64, 64, 62);
      grd.addColorStop(0, "rgba(0,0,0,0.42)"); grd.addColorStop(1, "rgba(0,0,0,0)");
      cx.fillStyle = grd; cx.fillRect(0, 0, 128, 128);
      const shTex = new THREE.CanvasTexture(cvs);
      const shadow = new THREE.Mesh(new THREE.PlaneGeometry(L + 1.4, W + 1.6),
        new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false }));
      shadow.rotation.x = -Math.PI / 2; // lie flat on the XZ ground plane
      shadow.position.y = 0.02;
      g.add(shadow);
      return g;
    };

    // ONE shared three.js renderer for ALL custom layers (deck, route ribbon, car).
    // Separate WebGLRenderer instances on the same MapLibre GL context clobber each
    // other's state → intermittent/partial rendering (the drive route ribbon was
    // truncating / vanishing once a third renderer was added). Share a single one.
    let _navRenderer = null;
    const navRenderer = (m, gl) => {
      if (!_navRenderer) {
        _navRenderer = new THREE.WebGLRenderer({ canvas: m.getCanvas(), context: gl, antialias: true });
        _navRenderer.autoClear = false;
      }
      return _navRenderer;
    };

    // ---- elevated-road 3D deck (three.js) --------------------------------------
    // Elevated roads (bridges/flyovers) drawn as a SLOPED ribbon mesh whose top
    // follows the baked z profile — genuinely smooth on ramps (fill-extrusion can only
    // make flat slabs that stair-step). Built from data/roads_3d.geojson ([lng,lat,z]
    // lines), densified for smooth ramps, given a slab thickness (curb walls) and lit
    // so the top reads bright / sides dark — a real concrete deck, not a flat blob.
    const ROAD_HALF_W = { motorway: 8, motorway_link: 5, trunk: 7, trunk_link: 5,
      primary: 6, primary_link: 4, secondary: 5, secondary_link: 4, tertiary: 4.5,
      unclassified: 4, residential: 3.5, living_street: 3, service: 2.5 };
    const DECK_THICK_M = 1.2, DECK_WIDTH_SCALE = 0.9, DECK_DENSIFY_M = 6;
    let roads3dData = { type: "FeatureCollection", features: [] };
    let deckJuncData = { type: "FeatureCollection", features: [] }; // junction slabs
    const buildElevatedRoadsMesh = () => {
      if (typeof THREE === "undefined" || !roads3dData.features.length) return null;
      const M = maplibregl.MercatorCoordinate;
      const c0 = map.getCenter();
      const origin = M.fromLngLat({ lng: c0.lng, lat: c0.lat }, 0);
      const meterUnit = origin.meterInMercatorCoordinateUnits();
      const thick = DECK_THICK_M * meterUnit, pos = [];
      const quad = (a, b, c, d) => {
        pos.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
        pos.push(a[0], a[1], a[2], c[0], c[1], c[2], d[0], d[1], d[2]);
      };
      for (const f of roads3dData.features) {
        if (!f.geometry || f.geometry.type !== "LineString") continue;
        // densify so ramps/curves are smooth (linear interp of lng,lat,z)
        const raw = f.geometry.coordinates, dense = [raw[0]];
        for (let i = 1; i < raw.length; i++) {
          const a = raw[i - 1], b = raw[i];
          const dm = Math.hypot((b[0] - a[0]) * Math.cos(a[1] * Math.PI / 180), b[1] - a[1]) * 111320;
          const n = Math.max(1, Math.ceil(dm / DECK_DENSIFY_M));
          for (let k = 1; k <= n; k++) { const t = k / n; dense.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, (a[2] || 0) + ((b[2] || 0) - (a[2] || 0)) * t]); }
        }
        const hwM = (ROAD_HALF_W[(f.properties || {}).highway] || 3.5) * DECK_WIDTH_SCALE * meterUnit;
        const mc = dense.map((c) => { const m = M.fromLngLat({ lng: c[0], lat: c[1] }, c[2] || 0); return [m.x - origin.x, m.y - origin.y, m.z - origin.z]; });
        const lt = [], rt = [], lb = [], rb = [];
        for (let i = 0; i < mc.length; i++) {
          const a = mc[Math.max(0, i - 1)], b = mc[Math.min(mc.length - 1, i + 1)];
          let dx = b[0] - a[0], dy = b[1] - a[1]; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
          const px = -dy * hwM, py = dx * hwM, T = mc[i][2], B = mc[i][2] - thick;
          lt.push([mc[i][0] + px, mc[i][1] + py, T]); rt.push([mc[i][0] - px, mc[i][1] - py, T]);
          lb.push([mc[i][0] + px, mc[i][1] + py, B]); rb.push([mc[i][0] - px, mc[i][1] - py, B]);
        }
        for (let i = 0; i < mc.length - 1; i++) {
          quad(lt[i], rt[i], rt[i + 1], lt[i + 1]); // top — SLOPES with z (smooth)
          quad(lt[i], lt[i + 1], lb[i + 1], lb[i]); // left curb wall
          quad(rt[i + 1], rt[i], rb[i], rb[i + 1]); // right curb wall
        }
      }
      // junction SLABS — cover each interchange as one filled deck surface (the polygon
      // is a convex hull, so a fan triangulation is valid), extruded down like the decks
      for (const f of (deckJuncData.features || [])) {
        if (!f.geometry || f.geometry.type !== "Polygon") continue;
        let ring = f.geometry.coordinates[0];
        if (!ring || ring.length < 4) continue;
        const last = ring[ring.length - 1];
        if (last[0] === ring[0][0] && last[1] === ring[0][1]) ring = ring.slice(0, -1);
        if (ring.length < 3) continue;
        const zA = (f.properties || {}).z || 0;
        const T = M.fromLngLat({ lng: ring[0][0], lat: ring[0][1] }, zA).z - origin.z, B = T - thick;
        const top = ring.map((c) => { const m = M.fromLngLat({ lng: c[0], lat: c[1] }, zA); return [m.x - origin.x, m.y - origin.y, T]; });
        const bot = top.map((p) => [p[0], p[1], B]);
        for (let i = 1; i < top.length - 1; i++) // top face (fan; hull is convex)
          pos.push(top[0][0], top[0][1], top[0][2], top[i][0], top[i][1], top[i][2], top[i + 1][0], top[i + 1][1], top[i + 1][2]);
        for (let i = 0; i < top.length; i++) { const j = (i + 1) % top.length; quad(top[i], top[j], bot[j], bot[i]); } // curb
      }
      if (!pos.length) return null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x8e939c, roughness: 0.95, metalness: 0, side: THREE.DoubleSide }));
      mesh.userData.origin = origin;
      return mesh;
    };
    const elevRoadLayer = {
      id: "elevated-roads-3d", type: "custom", renderingMode: "3d",
      onAdd(m, gl) {
        this.camera = new THREE.Camera(); this.scene = new THREE.Scene();
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dir = new THREE.DirectionalLight(0xffffff, 0.55); dir.position.set(0.4, -0.6, 1);
        this.scene.add(dir);
        this.mesh = buildElevatedRoadsMesh(); if (this.mesh) this.scene.add(this.mesh);
        this.renderer = navRenderer(m, gl);
      },
      rebuild() {
        if (!this.scene) return;
        if (this.mesh) { this.scene.remove(this.mesh); this.mesh.geometry.dispose(); this.mesh.material.dispose(); }
        this.mesh = buildElevatedRoadsMesh(); if (this.mesh) this.scene.add(this.mesh);
        if (window._setDeckTheme) window._setDeckTheme(darkOn); // reapply theme colour
        map.triggerRepaint();
      },
      render(gl, matrix) {
        if (!this.mesh || !MODES[viewMode].deck) return;    // 2D mode draws no deck
        const mArr = Array.isArray(matrix) ? matrix
          : (matrix && matrix.defaultProjectionData ? matrix.defaultProjectionData.mainMatrix : matrix && matrix.mainMatrix);
        if (!mArr) return;
        const o = this.mesh.userData.origin;
        this.camera.projectionMatrix = new THREE.Matrix4().fromArray(mArr).multiply(new THREE.Matrix4().makeTranslation(o.x, o.y, o.z));
        this.renderer.resetState();
        this.renderer.render(this.scene, this.camera);
      },
    };
    // recolour the deck material with the day/dark theme (called from applyTheme)
    window._setDeckTheme = (dark) => { if (elevRoadLayer.mesh) elevRoadLayer.mesh.material.color.setHex(dark ? 0x3a4353 : 0x8e939c); };
    let elevAdded = false;
    const addElevLayer = () => {
      if (elevAdded || typeof THREE === "undefined" || !roads3dData.features.length) return;
      try { map.addLayer(elevRoadLayer); elevAdded = true; } catch (_) {}
    };
    fetch("data/roads_3d.geojson").then((r) => r.json())
      .then((d) => { roads3dData = d; if (map.loaded()) addElevLayer(); }).catch(() => {});
    fetch("data/deck_junctions.geojson").then((r) => r.json())
      .then((d) => { deckJuncData = d; if (elevAdded) elevRoadLayer.rebuild(); }).catch(() => {});

    // ---- elevated DECK MARKINGS: edge lines + dashed lane dividers drawn along EVERY
    // elevated deck (data/deck_markings.geojson from bake-graph.mjs), sampled from the
    // deck's own z-profile so they ride it exactly — smooth ramps included. This is the
    // SOLE elevated-road detail. (An earlier osm2streets HD lane/marking overlay was
    // dropped: its altitude is FLAT per OSM way with no ramp data, so it floated / left
    // cliffs wherever the deck slopes. The graph deck ramps correctly, so its own
    // procedural markings are the only ones that stay glued to the road.)
    let deckMarkData = { type: "FeatureCollection", features: [] };
    const buildElevDetailMesh = () => {
      if (typeof THREE === "undefined" || !deckMarkData.features.length) return null;
      const M = maplibregl.MercatorCoordinate;
      const c0 = map.getCenter();
      const origin = M.fromLngLat({ lng: c0.lng, lat: c0.lat }, 0);
      const mu = origin.meterInMercatorCoordinateUnits();
      const byColor = new Map(); // hex -> flat triangle-soup position array
      // a thin flat ribbon along a [lng,lat,z] polyline, hugging the deck (lift clears z-fight)
      const pushLineRibbon = (arr, line, halfWm, lift) => {
        const hw = halfWm * mu;
        const mc = line.map((c) => { const m = M.fromLngLat({ lng: c[0], lat: c[1] }, (c[2] || 0) + lift); return [m.x - origin.x, m.y - origin.y, m.z - origin.z]; });
        const Ln = [], Rn = [];
        for (let i = 0; i < mc.length; i++) {
          const a = mc[Math.max(0, i - 1)], b = mc[Math.min(mc.length - 1, i + 1)];
          let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
          const px = -dy * hw, py = dx * hw;
          Ln.push([mc[i][0] + px, mc[i][1] + py, mc[i][2]]); Rn.push([mc[i][0] - px, mc[i][1] - py, mc[i][2]]);
        }
        for (let i = 0; i < mc.length - 1; i++) {
          const l0 = Ln[i], r0 = Rn[i], l1 = Ln[i + 1], r1 = Rn[i + 1];
          arr.push(l0[0], l0[1], l0[2], r0[0], r0[1], r0[2], r1[0], r1[1], r1[2]);
          arr.push(l0[0], l0[1], l0[2], r1[0], r1[1], r1[2], l1[0], l1[1], l1[2]);
        }
      };
      for (const f of deckMarkData.features) {
        if (!f.geometry || f.geometry.type !== "LineString") continue;
        // no solid edge/border lines — the deck curb defines the edge, and the two
        // strokes collided at forks/roundabouts. Only dashed lane dividers are drawn.
        if ((f.properties || {}).style === "edge") continue;
        const line = f.geometry.coordinates; if (line.length < 2) continue;
        let arr = byColor.get(0xdfe3ea); if (!arr) { arr = []; byColor.set(0xdfe3ea, arr); }
        pushLineRibbon(arr, line, 0.10, 0.08);
      }
      const group = new THREE.Group();
      for (const [col, arr] of byColor) {
        if (!arr.length) continue;
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
        group.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide,
          polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 })));
      }
      group.userData.origin = origin;
      return group;
    };
    const elevDetailLayer = {
      id: "elevated-detail-3d", type: "custom", renderingMode: "3d",
      onAdd(m, gl) {
        this.camera = new THREE.Camera(); this.scene = new THREE.Scene();
        this.group = buildElevDetailMesh();
        if (this.group) this.scene.add(this.group);
        this.renderer = navRenderer(m, gl);
      },
      rebuild() {
        if (!this.scene) return;
        if (this.group) { this.scene.remove(this.group); this.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
        this.group = buildElevDetailMesh(); if (this.group) this.scene.add(this.group);
        map.triggerRepaint();
      },
      render(gl, matrix) {
        if (!this.group || !MODES[viewMode].deckDetail) return; // Ultra only (3 MB of deck markings)
        const mArr = Array.isArray(matrix) ? matrix
          : (matrix && matrix.defaultProjectionData ? matrix.defaultProjectionData.mainMatrix : matrix && matrix.mainMatrix);
        if (!mArr) return;
        const o = this.group.userData.origin;
        this.camera.projectionMatrix = new THREE.Matrix4().fromArray(mArr).multiply(new THREE.Matrix4().makeTranslation(o.x, o.y, o.z));
        this.renderer.resetState();
        this.renderer.render(this.scene, this.camera);
      },
    };
    window._setDetailTheme = () => {}; // deck markings are white in both themes
    let elevDetailAdded = false;
    const addElevDetailLayer = () => {
      if (elevDetailAdded || typeof THREE === "undefined" || !deckMarkData.features.length) return;
      try { map.addLayer(elevDetailLayer); elevDetailAdded = true; } catch (_) {}
    };
    fetch("data/deck_markings.geojson").then((r) => r.json())
      .then((d) => { deckMarkData = d; if (elevDetailAdded) elevDetailLayer.rebuild(); else if (map.loaded()) addElevDetailLayer(); }).catch(() => {});

    // ======================================================================
    // 3D BUILDINGS (three.js) — real roof shapes + OSM colours (F4Map look).
    // fill-extrusion can only make flat-topped boxes, so in 3D Ultra we take the
    // buildings over with a three.js mesh built from the building features in view:
    // walls extruded base->eave, then a roof SOLID raised eave->top per OSM
    // roof:shape (gabled/hipped/skillion/pyramidal/dome/…), coloured from
    // building:colour / roof:colour (or a per-block earth tone). Outside Ultra the
    // native fill-extrusion still paints the whole city cheaply. Buildings stream in
    // the vector tiles, so querySourceFeatures returns exactly what's in view (free
    // culling) — we just rebuild on moveend. The roof shape is raised on the
    // footprint's min-area rectangle (most detailed buildings are rectangular); a
    // flat cap at the eave hides any footprint/box mismatch.
    //
    // This mesh is the single most expensive thing the viewer does, which is why it
    // belongs to 3D Ultra alone rather than to a zoom threshold: the user opts into
    // the cost by picking the mode, instead of tripping over it by zooming in.
    const BLDG_MAX = 12000;   // safety cap on plain buildings meshed per view
    let bldgDark = false, bldgVisible = true;
    const BLDG_TONES = [0xc7c0ac, 0xb3ac98, 0xc1b9a4, 0xa9a28e, 0xcac3b0, 0xb8b19d];
    const MAT_TINT = { glass: 0x9fb6c9, mirror: 0x9fb6c9, brick: 0x9c5a44, concrete: 0xb8b5ad,
      cement_block: 0xb8b5ad, stone: 0xb0a894, wood: 0x9c7b4f, plaster: 0xd9d2c2, marble: 0xe6e2da,
      metal: 0xb9c0c7, metal_sheet: 0xb9c0c7, copper: 0x59a68a };
    const ROOF_MAT_TINT = { roof_tiles: 0xa0512f, tile: 0xa0512f, metal: 0x9aa0a6, metal_sheet: 0x9aa0a6,
      concrete: 0xb0ada4, glass: 0x9fb6c9, copper: 0x59a68a, slate: 0x55606b, thatch: 0xb08a4f };
    // OSM `building:colour` / `roof:colour` are free text: roughly half are hex,
    // the rest are CSS colour NAMES. Passing a name straight to THREE.Color yields
    // the fully saturated CSS primary — "blue" becomes #0000ff — which is why whole
    // blocks rendered in electric blue (20 buildings around Mễ Trì are tagged
    // roof:colour=blue). No real building is a pure primary, so named colours
    // resolve through a muted building palette instead.
    //
    // These tints are an INTERPRETATION of a vague tag, not survey data — same
    // discipline as the inferred heights and lane widths elsewhere in this repo.
    // Hex values are authored precisely, so they pass through untouched.
    // Hand-picked tints for the names that actually occur on buildings here, incl.
    // the Vietnamese ones OSM contributors in Hanoi use.
    const NAMED_TINT = {
      white: 0xeeeae2, ivory: 0xf0e9d8, cream: 0xf0e9d8, beige: 0xe3d9c2, tan: 0xcbb894,
      silver: 0xc9c9c6, lightgrey: 0xcccbc6, lightgray: 0xcccbc6, grey: 0xb6b6b2, gray: 0xb6b6b2,
      darkgrey: 0x6f7175, darkgray: 0x6f7175, dimgray: 0x6f7175, dimgrey: 0x6f7175, black: 0x3a3a3c,
      brown: 0x8a6a4b, maroon: 0x7a4038, red: 0xa8544a, orange: 0xc88a52,
      yellow: 0xd9c07a, gold: 0xc8a95e, green: 0x7d8f6a, darkgreen: 0x5c6b4f,
      blue: 0x6d8296, lightblue: 0x9fb4c4, navy: 0x4a5a72, teal: 0x5f8286,
      purple: 0x7a6a86, violet: 0x7a6a86, pink: 0xd3b3ad,
      // Vietnamese colour names (the target city is Hanoi)
      "đỏ": 0xa8544a, "trắng": 0xeeeae2, "đen": 0x3a3a3c, "vàng": 0xd9c07a,
      "nâu": 0x8a6a4b, "xám": 0xb6b6b2, "xanh": 0x6d8296,
    };
    // Any OTHER real CSS keyword (lemonchiffon, steelblue, firebrick, …) keeps its
    // hue but gets pulled into a range a building can plausibly be: saturation and
    // lightness are clamped, because s=1.0 / l=0.5 is exactly what reads as
    // electric plastic rather than paint.
    const MAX_SAT = 0.35, MIN_LIT = 0.32, MAX_LIT = 0.86;
    const muted = (c) => {
      const hsl = {};
      c.getHSL(hsl);
      return c.setHSL(hsl.h, Math.min(hsl.s, MAX_SAT), Math.min(MAX_LIT, Math.max(MIN_LIT, hsl.l)));
    };
    const safeColor = (s) => {
      if (!s) return null;
      const t = String(s).trim().toLowerCase();
      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/.test(t)) return new THREE.Color(t);
      if (NAMED_TINT[t] != null) return new THREE.Color(NAMED_TINT[t]);
      // Only trust a name THREE actually knows. This check is what the old
      // try/catch was reaching for and never got: THREE.Color does NOT throw on an
      // unrecognised string — it warns and leaves the colour WHITE — so junk tags
      // silently produced white buildings instead of falling back as intended.
      if (THREE.Color.NAMES && THREE.Color.NAMES[t] !== undefined) return muted(new THREE.Color(t));
      return null; // unknown -> material tint / per-block earth tone
    };
    const toneFor = (id) => new THREE.Color(BLDG_TONES[(((parseInt(id, 10) || 0) % 6) + 6) % 6]);
    // How far a tagged colour may pull a building away from its block's earth tone.
    //   1 = tag verbatim      0 = ignore tags entirely (exactly 3D mode's palette)
    //
    // Verbatim tags are what made Ultra read as broken beside 3D. OSM records
    // Tháp Hà Nội as a brown 5-storey podium under white 29- and 16-storey towers —
    // which is TRUE, and which rendered as a brown box with white slabs erupting out
    // of it, nothing like the quiet block tones of every neighbour. Blending keeps
    // the information (a brown building still reads browner, glass still reads
    // cooler) without one tagged building shouting over the whole street.
    //
    // Raise this toward 1 for literal OSM colours; drop to 0 to match 3D exactly.
    const TAG_BLEND = 0.35;
    const wallColorOf = (p) => {
      if (bldgDark) return new THREE.Color(0x00e5ff);
      const tone = toneFor(p.osm_way_id);
      const tagged = safeColor(p.colour)
        || (p.material && MAT_TINT[p.material] && new THREE.Color(MAT_TINT[p.material]));
      return tagged ? tone.lerp(tagged, TAG_BLEND) : tone;
    };
    // `raised` = a genuinely shaped roof is being built for this building.
    //
    // When it is NOT, the cap we draw is just the top of the walls, so it takes the
    // WALL colour. Painting that cap with roof:colour put a contrasting lid on every
    // flat-roofed tower (the Mễ Trì blocks are tagged roof:colour=blue), which read
    // as a rendering fault rather than a roof. The tag describes a roof SURFACE —
    // with no roof drawn there is no surface for it to describe.
    //
    // Dark mode is deliberately left alone: its darker cap over neon-cyan walls is
    // the intended night look, not an accident.
    const roofColorOf = (p, wc, raised) => {
      if (bldgDark) return new THREE.Color(0x0a7d92);
      if (!raised) return wc.clone();
      const tagged = safeColor(p.roof_colour)
        || (p.roof_material && ROOF_MAT_TINT[p.roof_material] && new THREE.Color(ROOF_MAT_TINT[p.roof_material]));
      // a raised roof blends toward ITS OWN walls, for the same reason as above
      return tagged ? wc.clone().lerp(tagged, TAG_BLEND) : wc.clone().lerp(new THREE.Color(0x8f8377), TAG_BLEND);
    };
    const normShape = (s) => { if (!s) return "flat"; s = String(s).toLowerCase();
      if (s === "pitched") return "gabled"; if (s === "pyramid") return "pyramidal";

    // footprint's vertex order.
    const convexHull = (P) => {
      const pts = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);

    const swapAxes = (box) => { const t = box.a; box.a = box.b; box.b = t;
      let s = box.ux; box.ux = box.vx; box.vx = s; s = box.uy; box.uy = box.vy; box.vy = s; };
    // Height of the roof solid, in metres. Returns 0 for "no roof — flat top".
    //
    // Only 18 of the 225 shaped-roof buildings in this bake carry an explicit
    // roof:height, and NONE carry roof:angle — so for 92% of them any roof we draw
    // is a height we INVENTED from the building's own height. On a house that
    // guess is harmless and looks right. On a 7-storey apartment block it is not:
    // it bolts a 4 m pitched roof across the whole footprint of a flat-topped
    // tower, which is what kept reading as a broken render around Mễ Trì (those
    // blocks are tagged roof:shape=saltbox with no roof:height at all).
    //

    // norm. Above the cutoff we need a mapper to have actually stated the roof
    // height; absent that we draw a flat top rather than invent a silhouette.
    // Domes/onions are exempt — nobody tags those by accident, and the dome IS
    // the landmark, so suppressing it would lose real information.
    const ROOF_INFER_MAX_M = 12;   // ~4 storeys at the baked 3 m/level
    const roofHeightM = (p, box, meterUnit, shape) => {
      if (!shape || shape === "flat") return 0;

      if (p.roof_angle != null) return Math.tan(Math.min(60, Math.max(1, +p.roof_angle)) * Math.PI / 180) * halfShortM;
      const hM = +p.height || 6;

    //

    //   meterUnit : mercator units per metre at the origin latitude
    //

    const meshBuilding = (rings, p, meterUnit) => {

          pushTri(E00, R0, E01, c); pushTri(E10, E11, R1, c);
        } else if (shape === "hipped" || shape === "mansard" || shape === "pyramidal") {
          const hr = shape === "pyramidal" ? 0 : Math.max(0, 1 - box.b / box.a);
          const R0 = bp(-hr, 0, zT), R1 = bp(hr, 0, zT);
          pushQuad(E00, E10, R1, R0, c); pushQuad(E11, E01, R0, R1, c);
          pushTri(E00, R0, E01, c); pushTri(E10, E11, R1, c);
        } else if (shape === "skillion") {
          const s = box.hiSign || 1;
          const L0 = bp(-1, -s, zE), L1 = bp(1, -s, zE), H1 = bp(1, s, zT), H0 = bp(-1, s, zT);
          pushQuad(L0, L1, H1, H0, c);
          pushTri(L0, H0, bp(-1, s, zE), c); pushTri(L1, bp(1, s, zE), H1, c);
        } else if (shape === "dome" || shape === "onion" || shape === "round") {
          const r = Math.min(box.a, box.b), N = 12, seg = 16, H = zT - zE;
          const prof = (t) => shape === "onion"
            ? { rr: r * Math.max(0, Math.cos(t * Math.PI / 2) + 0.35 * Math.sin(t * Math.PI) * (1 - t)), zz: zE + H * Math.pow(Math.sin(t * Math.PI / 2), 0.7) }
            : { rr: r * Math.cos(t * Math.PI / 2), zz: zE + H * Math.sin(t * Math.PI / 2) };
          const P = (rad, ang, z) => [box.cx + (Math.cos(ang) * box.ux + Math.sin(ang) * box.vx) * rad, box.cy + (Math.cos(ang) * box.uy + Math.sin(ang) * box.vy) * rad, z];
          let prev = prof(0);
          for (let sI = 1; sI <= N; sI++) {
            const cur = prof(sI / N);
            for (let aI = 0; aI < seg; aI++) {
              const a0 = aI / seg * 2 * Math.PI, a1 = (aI + 1) / seg * 2 * Math.PI;
              pushQuad(P(prev.rr, a0, prev.zz), P(prev.rr, a1, prev.zz), P(cur.rr, a1, cur.zz), P(cur.rr, a0, cur.zz), c);

        // A shaped roof is raised on the footprint's BOUNDING RECTANGLE, which only
        // resembles the building when the footprint is roughly rectangular. On an
        // L-plan or courtyard block the rect can be twice the footprint area and the
        // gable then hangs in mid-air well past the walls — measured up to 58%
        // overhang on the Mễ Trì apartment blocks (roof:shape=saltbox, no
        // roof:height, so roofHeightM defaults to a 4 m gable). The eave cap cannot
        // hide that: the cap follows the footprint, the gable follows the rect.

        // otherwise fall back to a flat roof, which is always inside the walls.

        // dome/onion/round are inscribed (radius = min(box.a, box.b)) so they sit

      if (!pos.length) return null;
      // Normals computed PER BUILDING are identical to normals computed over the
      // whole city: these buffers are non-indexed, so no vertex is ever shared
      // between buildings and computeVertexNormals() only averages within a
      // triangle. Doing it here moves another O(vertices) pass off the main thread.
      const g0 = new THREE.BufferGeometry();

    // single cache entry and can never render as a partial building.
    const meshFeature = (polys, p, meterUnit) => {
      const parts = [];

    // ---- FIXED origin ---------------------------------------------------------
    // Cached geometry must live in ONE coordinate frame, so the origin is the city
    // centre, not the map centre — with the map centre every pan would invalidate the
    // whole cache. Mercator offsets across the bake bbox stay under ~2e-4, which in
    // float32 resolves to about a millimetre: far finer than anything here claims.

      lng: (CITY_BOUNDS[0][0] + CITY_BOUNDS[1][0]) / 2,
      lat: (CITY_BOUNDS[0][1] + CITY_BOUNDS[1][1]) / 2,
    }, 0);

      "roof_colour", "roof_material", "osm_way_id"];

      const o = {};
      for (const k of BLDG_PROP_KEYS) if (p[k] != null) o[k] = p[k];

    };

    // ---- tessellation worker --------------------------------------------------
    // Source is assembled from the live functions above, so the worker can never
    // fall out of step with the main thread. Shipped as a Blob URL because this repo
    // must stay a build-free static site — the same trick F4Map uses.
    const THREE_URL = "https://unpkg.com/three@0.128.0/build/three.min.js";
    const bldgWorkerSrc = () => `
      importScripts(${JSON.stringify(THREE_URL)});
      let bldgDark = false;
      const BLDG_TONES = ${JSON.stringify(BLDG_TONES)};
      const MAT_TINT = ${JSON.stringify(MAT_TINT)};
      const ROOF_MAT_TINT = ${JSON.stringify(ROOF_MAT_TINT)};

          if (done) { bldgWorkerPending.delete(e.data.id); done(e.data.out); }

        // (same functions, just blocking) and resolve anything still waiting.
        w.onerror = () => {

    // ---- orchestrator ---------------------------------------------------------
    // Main thread does only cheap work: query, dedupe, project, and finally memcpy
    // cached buffers together. Tessellation (triangulation, roof solids, normals)
    // happens in the worker, and only for buildings not already in the cache.
    let bldgBuildToken = 0;
    const buildBuildingsMesh = async () => {

      // Order-INDEPENDENT (sum + xor, not a positional hash): querySourceFeatures

      // order — rebuilding on every idle and defeating the point.

      for (const f of feats) { const id = +f.properties.osm_way_id || 0; sum = (sum + id) | 0; xor ^= id; }

      // buildings in this bake (9.9%) straddle a z17 boundary — worst case 6 tiles —

        // handed back twice hashes identically and is deduped. Stable across calls,
