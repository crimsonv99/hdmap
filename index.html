    // georeferenced from DRIVE.carPos/carHeading. Added once, then shown/hidden.
    const carLayer = {
      id: "drive-car-3d", type: "custom", renderingMode: "3d",
      onAdd(map, gl) {
        this.camera = new THREE.Camera();
        this.scene = new THREE.Scene();
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(0.6, 1.4, 0.8);
        this.scene.add(key);
        const fill = new THREE.DirectionalLight(0xbcd0ff, 0.35); fill.position.set(-0.7, 0.6, -0.5);
        this.scene.add(fill);
        this.car = buildCarMesh(); this.car.visible = false;
        this.scene.add(this.car);
        this.renderer = new THREE.WebGLRenderer({ canvas: map.getCanvas(), context: gl, antialias: true });
        this.renderer.autoClear = false;
      },
      render(gl, matrix) {
        if (!DRIVE.carPos || !this.car) return;
        // v4 passes the mercator matrix as an array; v5 may pass a projection object
        const mArr = Array.isArray(matrix) ? matrix
          : (matrix && matrix.defaultProjectionData ? matrix.defaultProjectionData.mainMatrix : matrix && matrix.mainMatrix);
        if (!mArr) return;
        const c = maplibregl.MercatorCoordinate.fromLngLat({ lng: DRIVE.carPos[0], lat: DRIVE.carPos[1] }, 0);
        const s = c.meterInMercatorCoordinateUnits();
        // yaw the car about its local (Y-up) vertical: heading 0=N, 90=E (see derivation)
        this.car.rotation.y = Math.PI - DRIVE.carHeading * Math.PI / 180;
        const l = new THREE.Matrix4()
          .makeTranslation(c.x, c.y, c.z)
          .scale(new THREE.Vector3(s, -s, s))
          .multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2)); // Y-up model → map Z-up
        this.camera.projectionMatrix = new THREE.Matrix4().fromArray(mArr).multiply(l);
        this.renderer.resetState();
        this.renderer.render(this.scene, this.camera);
      },
    };

    let carLayerAdded = false;
    const setupCarLayer = (pos, heading) => {
      DRIVE.carPos = pos; DRIVE.carHeading = heading;
      if (typeof THREE === "undefined") return; // three.js failed to load → skip the car, drive still works
      if (!carLayerAdded) { map.addLayer(carLayer); carLayerAdded = true; }
      if (carLayer.car) carLayer.car.visible = true;
    };
    const hideForDrive = (on) => {
      for (const id of ["controls", "legend", "readout", "search", "nav-summary"]) {
        const el = document.getElementById(id); if (el) el.style.display = on ? "none" : "";
      }
    };

    const DRIVE = { active: false, raf: 0, paused: false, d: 0, total: 0, timeS: 0, carPos: null, carHeading: 0, last: 0, lastGuide: 0, mode: "3d", curSpeed: 0 };

    // 2D flat car marker (a DOM arrow) — used instead of the three.js mesh when the
    // driver flips to 2D nav mode during the trip.
    let car2d = null;
    const ensureCar2d = () => {
      if (!car2d) {
        const el = document.createElement("div"); el.className = "car2d";
        // bold blue nav chevron with a white outline + halo — high contrast on both
        // the light and dark basemaps (the old green-on-dark arrow was hard to see)
        el.innerHTML =
          '<svg width="48" height="48" viewBox="0 0 48 48">' +
          '<circle cx="24" cy="24" r="22" fill="rgba(47,107,214,0.22)"/>' +
          '<path d="M24 5 L38 41 L24 32 L10 41 Z" fill="#2f6bd6" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>' +
          '</svg>';
        car2d = new maplibregl.Marker({ element: el, rotationAlignment: "map", anchor: "center" });
      }
      return car2d;
    };
    // Switch the follow-cam between 3D (mesh) and 2D (flat marker) live, mid-trip.
    const setDriveMode = (mode) => {
      DRIVE.mode = mode;
      const b = document.getElementById("drive-bottom").querySelector(".mode");
      if (b) b.textContent = mode === "3d" ? "3D" : "2D"; // shows the CURRENT view (tap toggles)
      if (carLayer.car) carLayer.car.visible = (mode === "3d") && DRIVE.active;
      if (mode === "2d") { if (DRIVE.carPos) ensureCar2d().setLngLat(DRIVE.carPos).setRotation(DRIVE.carHeading).addTo(map); }
      else if (car2d) car2d.remove();
      map.triggerRepaint();
    };

    // exterior ring of a lane polygon (used to dedupe queried lane features)
    const ringOf = (g) => g.type === "Polygon" ? g.coordinates[0] : g.type === "MultiPolygon" ? g.coordinates[0][0] : null;

    const clearLaneGuide = () => { const s = map.getSource("lane-guide"); if (s) s.setData({ type: "FeatureCollection", features: [] }); };
    // `winWays` = [{w, dir}] for the current way + one ahead. A lane is highlighted
    // iff its osm_way_ids contains one of those ways AND its direction matches our
    // travel — exact, so no cross-street / oncoming / parallel-road false positives.
    const updateLaneGuide = (pos, winWays) => {
      const src = map.getSource("lane-guide");
      if (!src || !winWays || !winWays.length) return;
      const p = map.project(pos);
      // narrow, forward-only box: hugs the car's own driving lane(s) AHEAD (screen
      // up = travel direction), so it no longer paints the full carriageway, the
      // oncoming side, or the stretch behind the car.
      const box = [[p.x - 80, p.y - 260], [p.x + 80, p.y + 20]];
      let feats = [];
      try { feats = map.queryRenderedFeatures(box, { layers: ["lanes", "lanes-hi"] }); } catch (_) {}
      const seen = new Set(), out = [];
      for (const f of feats) {
        const pr = f.properties || {};
        if (pr.type !== "Driving") continue;
        const ids = String(pr.osm_way_ids).match(/\d+/g);
        if (!ids) continue;
        if (!winWays.some((ww) => ww.dir === pr.direction && ids.includes(ww.w))) continue;
        const ring = ringOf(f.geometry);
        const key = ring ? `${ring[0][0].toFixed(5)},${ring[0][1].toFixed(5)}` : String(out.length);
        if (seen.has(key)) continue; seen.add(key);
        out.push({ type: "Feature", geometry: f.geometry, properties: {} });
      }
      src.setData({ type: "FeatureCollection", features: out });
    };

    const stopDrive = () => {
      DRIVE.active = false;
      if (DRIVE.raf) cancelAnimationFrame(DRIVE.raf);
      // hide (don't remove) the 3D car layer so its single WebGL renderer is reused
      DRIVE.carPos = null;
      if (carLayer.car) carLayer.car.visible = false;
      if (car2d) car2d.remove();
      if (carLayerAdded) map.triggerRepaint(); // clear the last car frame
      clearLaneGuide();
      if (map.getSource("nav-turn")) map.getSource("nav-turn").setData(emptyFC); // drop the yellow turn overlay
      driveUI.classList.remove("on");
      hideForDrive(false);
      togglePanel(true);
      // restore the full route line (drive mode trimmed it to the road ahead)
      if (NAV.lastRoute && map.getSource("nav-route"))
        map.getSource("nav-route").setData({ type: "Feature", geometry: { type: "LineString", coordinates: NAV.lastRoute.coords } });
      if (NAV.lastRoute) { navSummary.classList.add("on"); fitRoute(NAV.lastRoute.coords); }
    };

    const startDrive = (r) => {
      if (!r || !r.coords || r.coords.length < 2) return;
      // drive the lane-offset path (car + camera + drawn route all follow it, so
      // they stay consistent). Planning view keeps the centerline.
      const pts = offsetRight(r.coords, LANE_OFFSET_M), cum = [0];
      for (let i = 1; i < pts.length; i++) cum[i] = cum[i - 1] + metersBetween(pts[i - 1], pts[i]);
      const total = cum[cum.length - 1] || 1;
      const mans = r.maneuvers, turnAt = []; let acc = 0;
      for (let i = 0; i < mans.length; i++) { turnAt[i] = acc; acc += mans[i].dist || 0; }
      // way-runs: merge consecutive legs sharing (way, dir) into distance ranges,
      // so the lane highlight can cover the current way + exactly one ahead
      const runs = []; let racc = 0;
      for (const lw of (r.legWays || [])) {
        const last = runs[runs.length - 1];
        if (last && last.w === lw.w && last.dir === lw.dir) last.end += lw.len;
        else runs.push({ w: lw.w, dir: lw.dir, start: racc, end: racc + lw.len });
        racc += lw.len;
      }
      let segIdx = 0, manPtr = 1, runPtr = 0;
      // all three pointers reset when d moves backwards (e.g. the ↺ restart) so the
      // walk never gets stuck at the end of the route.
      const curRun = (d) => { if (runPtr && d < runs[runPtr].start) runPtr = 0;
        while (runPtr < runs.length - 1 && d >= runs[runPtr].end) runPtr++; return runPtr; };
      // pure position sampler (does NOT move segIdx) — safe to call for arbitrary d
      const posAt = (d) => {
        let i = 0; while (i < pts.length - 2 && cum[i + 1] < d) i++;
        const a = pts[i], b = pts[i + 1], segLen = (cum[i + 1] - cum[i]) || 1;
        const t = Math.max(0, Math.min(1, (d - cum[i]) / segLen));
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      };
      const sampleAt = (d) => {
        if (d < cum[segIdx]) segIdx = 0;
        while (segIdx < pts.length - 2 && cum[segIdx + 1] < d) segIdx++;
        const a = pts[segIdx], b = pts[segIdx + 1], segLen = (cum[segIdx + 1] - cum[segIdx]) || 1;
        const t = Math.max(0, Math.min(1, (d - cum[segIdx]) / segLen));
        return { pos: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], heading: bearingDeg(a, b) };
      };
      // slice the route polyline between two distances (for the yellow turn stretch)
      const sliceRoute = (d0, d1) => {
        if (d1 - d0 < 1) return null;
        const out = [posAt(d0)];
        for (let i = 0; i < pts.length; i++) if (cum[i] > d0 && cum[i] < d1) out.push(pts[i]);
        out.push(posAt(d1));
        return out.length >= 2 ? out : null;
      };
      const upcoming = (d) => { if (manPtr > 1 && d < turnAt[manPtr - 1]) manPtr = 1;
        while (manPtr < mans.length - 1 && d >= turnAt[manPtr]) manPtr++; return manPtr; };
      const updateHud = (mi) => {
        const man = mans[mi], isFinished = DRIVE.d >= total;
        dBanner.querySelector(".b-ic").textContent = TURN_GLYPH[man.turn] || "↑";
        dBanner.querySelector(".b-dist").textContent = fmtDist(Math.max(0, turnAt[mi] - DRIVE.d));
        dBanner.querySelector(".b-road").textContent = isFinished ? "Arrived at destination" : (man.name || (man.turn === "arrive" ? "Arrive at destination" : ""));
        // "Then <arrow>" — preview the maneuver after the upcoming one
        const then = mans[mi + 1], thenEl = dBanner.querySelector(".b-then");
        if (then && !isFinished) { dBanner.querySelector(".b-then-ic").textContent = TURN_GLYPH[then.turn] || "↑"; thenEl.classList.add("on"); }
        else thenEl.classList.remove("on");
        // speed cluster: current (eased) speed + posted limit of the road we're on
        dSpeedEl.textContent = isFinished ? "0" : Math.round(DRIVE.curSpeed * 3.6);
        const lim = mans[Math.max(0, mi - 1)].lim;
        dLimitEl.textContent = lim ? lim : "–";

        const remainT = Math.max(0, DRIVE.timeS * (1 - DRIVE.d / total));
        dBottom.querySelector(".remain").textContent = fmtDur(remainT);
        dBottom.querySelector(".dist").textContent = fmtDist(Math.max(0, total - DRIVE.d));
        dBottom.querySelector(".eta").textContent = isFinished ? "Arrived" : "Arrive ~" + clockAfter(remainT);
      };
      const tick = (ts) => {
        if (!DRIVE.active) return;
        if (!DRIVE.last) DRIVE.last = ts;
        let dt = (ts - DRIVE.last) / 1000; DRIVE.last = ts; if (dt > 0.1) dt = 0.1;
        const mi = upcoming(DRIVE.d);
        // cruise at the road's posted speed (so the speedometer sits near the limit),
        // falling back to the effective speed only if no posted value is known
        const cm = mans[Math.max(0, mi - 1)];
        const posted = cm.lim ? cm.lim / 3.6 : (cm.spd || 8);
        // slow into a real turn: scale down as we approach the next turning maneuver
        const isTurn = /left|right|uturn/.test(mans[mi] ? mans[mi].turn : "");
        const toTurn = turnAt[mi] - DRIVE.d;
        const slow = (isTurn && toTurn < TURN_SLOW_M)
          ? TURN_SLOW_MIN + (1 - TURN_SLOW_MIN) * Math.max(0, toTurn) / TURN_SLOW_M : 1;
        DRIVE.curSpeed = posted * slow;
        if (!DRIVE.paused) {
          DRIVE.d += DRIVE.curSpeed * PLAYBACK * dt;
          if (DRIVE.d > total) DRIVE.d = total;
        }
        const s = sampleAt(DRIVE.d);
        DRIVE.carPos = s.pos; DRIVE.carHeading = s.heading; // 3D car reads these in its render()
        // ease the camera bearing toward the heading so turns glide instead of snapping
        const diff = ((s.heading - DRIVE.camBearing + 540) % 360) - 180;
        DRIVE.camBearing = (DRIVE.camBearing + diff * Math.min(1, dt * TURN_EASE) + 360) % 360;
        const V = DRIVE_VIEW[DRIVE.mode];
        map.jumpTo({ center: moveAlong(s.pos, DRIVE.camBearing, V.look), bearing: DRIVE.camBearing, pitch: V.pitch, zoom: V.zoom });
        if (DRIVE.mode === "2d" && car2d) car2d.setLngLat(s.pos).setRotation(s.heading);
        // show only the road AHEAD — trim the blue route to the remaining portion so
        // the already-driven stretch behind the car disappears (like real nav)
        const rsrc = map.getSource("nav-route");
        if (rsrc) { const rem = sliceRoute(DRIVE.d, total);
          rsrc.setData(rem ? { type: "Feature", geometry: { type: "LineString", coordinates: rem } } : emptyFC); }
        // paint the immediate upcoming-turn stretch yellow (car → next turn), rest blue
        const tsrc = map.getSource("nav-turn");
        if (tsrc) {
          const nearTurn = mans[mi] && /left|right|uturn/.test(mans[mi].turn) && (turnAt[mi] - DRIVE.d) < 160;
          const seg = nearTurn ? sliceRoute(DRIVE.d, turnAt[mi]) : null;
          tsrc.setData(seg ? { type: "Feature", geometry: { type: "LineString", coordinates: seg } } : { type: "FeatureCollection", features: [] });
        }
        if (ts - DRIVE.lastGuide > 180) { // throttle lane highlight; window = current way + one ahead
          DRIVE.lastGuide = ts;
          const rp = curRun(DRIVE.d);
          // only pre-light the NEXT way when we're close to it — otherwise a
          // diverging side road lights up green hundreds of metres early
          const nearNext = runs[rp] && (runs[rp].end - DRIVE.d) < 70;
          const winWays = [runs[rp], nearNext ? runs[rp + 1] : null].filter(Boolean).map((r) => ({ w: r.w, dir: r.dir }));
          updateLaneGuide(s.pos, winWays);
        }
        updateHud(mi);
        if (DRIVE.d >= total && !DRIVE.paused) { 
          DRIVE.paused = true; 
          dBottom.querySelector(".pause").textContent = "↺"; 
        }
        DRIVE.raf = requestAnimationFrame(tick);
      };

      const s0 = sampleAt(0);
      Object.assign(DRIVE, { active: true, paused: false, d: 0, total, timeS: r.timeS, last: 0, camBearing: s0.heading });
      hideForDrive(true);
      togglePanel(false); navStepsBtn.classList.remove("on"); navHint.classList.remove("on");
      driveUI.classList.add("on");
      dBottom.querySelector(".pause").textContent = "⏸";
      setupCarLayer(s0.pos, s0.heading);
      setDriveMode(is3d ? "3d" : "2d"); // launch in whatever mode the map is currently showing
      dBottom.querySelector(".theme").textContent = darkOn ? "☀️" : "🌙";
      const V0 = DRIVE_VIEW[DRIVE.mode];
      map.jumpTo({ center: moveAlong(s0.pos, s0.heading, V0.look), bearing: s0.heading, pitch: V0.pitch, zoom: V0.zoom });
      DRIVE.raf = requestAnimationFrame(tick);
    };

    dBottom.querySelector(".pause").onclick = () => {
      if (!DRIVE.active) return;
      DRIVE.last = 0;
      if (DRIVE.d >= DRIVE.total) {           // arrived → this button is "↺ restart"
        DRIVE.d = 0; DRIVE.paused = false;
        dBottom.querySelector(".pause").textContent = "⏸";
        return;
      }
      DRIVE.paused = !DRIVE.paused;
      dBottom.querySelector(".pause").textContent = DRIVE.paused ? "▶" : "⏸";
    };
    dBottom.querySelector(".exit").onclick = stopDrive;
    // switch 2D / 3D live during the trip
    dBottom.querySelector(".mode").onclick = () => setDriveMode(DRIVE.mode === "3d" ? "2d" : "3d");
    // switch day / night live during the trip (drives the same global theme)
    dBottom.querySelector(".theme").onclick = () => {
      btnDark.onclick();
      dBottom.querySelector(".theme").textContent = darkOn ? "☀️" : "🌙";
    };

    const computeRoute = () => {
      const [a, b] = NAV.points;
      const t0 = performance.now();
      const r = NAV.route(a.snap, b.snap);
      const ms = (performance.now() - t0).toFixed(1);
      if (!r) { navHint.textContent = "⚠ No route found between those points"; navSummary.classList.remove("on"); togglePanel(false); console.warn("[nav] no route"); return; }
      // route() already begins/ends exactly at the snapped points (partial edges)
      const coords = r.coords;
      ensureRouteLayer();
      map.getSource("nav-route").setData({ type: "Feature", geometry: { type: "LineString", coordinates: coords } });
      showSummary(r);
      renderPanel(r);
      fitRoute(coords);
      navHint.textContent = "Click again to start over";
      NAV.lastRoute = r;
      console.log(`[nav] route: ${r.nodes} nodes, ${fmtDist(r.distM)}, ${fmtDur(r.timeS)}, A* in ${ms}ms`);
      console.log(`[nav] ${r.maneuvers.length} maneuvers:`);
      r.maneuvers.forEach((m, i) => console.log(`   ${i + 1}. ${m.instruction}${m.dist ? " — " + fmtDist(m.dist) : ""}`));
    };

    const SNAP_MAX_M = 150; // farther than this from any road = off the mapped network
    const placePoint = (lngLat) => {
      if (NAV.points.length >= 2) { resetNav(); return; } // guard: already have A+B
      const s = NAV.snap(lngLat.lng, lngLat.lat);
      if (s.distM > SNAP_MAX_M) {
        navHint.textContent = "⚠ No road near there — pick a point on the mapped area";
        return;
      }
      const label = NAV.points.length === 0 ? "A" : "B";
      const marker = new maplibregl.Marker({ element: makePin(label), anchor: "bottom" })
        .setLngLat([s.lng, s.lat]).addTo(map);
      NAV.points.push({ marker, snap: s });
      console.log(`[nav] ${label} snapped ${s.distM}m to edge #${s.e}, node #${s.node}`);
      if (NAV.points.length === 2) computeRoute(); else setHint();
    };

    let lastPick = 0;
    map.on("click", (e) => {
      if (!NAV.pickMode || !NAV.graph) return;
      const now = performance.now();
      if (now - lastPick < 350) return; // swallow the paired click of a dbl-click
      lastPick = now;
      if (NAV.points.length >= 2) { resetNav(); return; } // 3rd click resets
      placePoint(e.lngLat);
    });

    btnRoute.onclick = () => {
      NAV.pickMode = !NAV.pickMode;
      btnRoute.classList.toggle("on", NAV.pickMode);
      navHint.classList.toggle("on", NAV.pickMode);
      map.getCanvas().style.cursor = NAV.pickMode ? "crosshair" : "";
      if (NAV.pickMode) { NAV.ensureGraph().catch(() => {}); setHint(); }
      else { resetNav(); }
    };

    // one-time verification (Task 3) — load after the map goes idle so it can't
    // slow the first paint, then log a self-check. Remove once the UI drives loads.
    map.once("idle", () => {
      const t0 = performance.now();
      NAV.ensureGraph().then((g) => {
        const ms = (performance.now() - t0).toFixed(0);
        const dirEdges = [...NAV.adj.values()].reduce((s, a) => s + a.length, 0);
        // pick a node with the most neighbours as a sample lookup
        let sample = null, best = -1;
        for (const [n, a] of NAV.adj) if (a.length > best) { best = a.length; sample = n; }
        console.log(`[nav] graph loaded in ${ms}ms`);
        console.log(`[nav]   nodes=${g.meta.nodes} (adj has ${NAV.adj.size} with out-edges)`);
        console.log(`[nav]   edges=${g.meta.edges} -> ${dirEdges} directed adjacency entries`);
        console.log(`[nav]   classes=${g.classes.length}, names=${g.names.length}`);
        const [lng, lat] = NAV.nodeLngLat(sample);
        console.log(`[nav]   busiest node #${sample} @ ${lat.toFixed(5)},${lng.toFixed(5)} has ${best} neighbours:`,
          NAV.adj.get(sample).map((x) => `${g.classes[x.cls]}(${x.len}m)`));
      }).catch(() => {});
    });
  </script>
</body>
</html>
