        let w = Infinity, s = Infinity, e = -Infinity, nth = -Infinity;
        for (const poly of polysIn) for (const r of poly) for (const c of r) {
          if (c[0] < w) w = c[0]; if (c[0] > e) e = c[0];
          if (c[1] < s) s = c[1]; if (c[1] > nth) nth = c[1];
        }
        const bb = { w, s, e, n: nth, area: Math.max(1e-12, (e - w) * (nth - s)) };
        // Two DIFFERENT things can hand us the same way id twice:
        //   1. adjacent tiles, each holding a clipped PIECE   -> bboxes barely overlap
        //      -> keep both, that's how the building gets fully covered
        //   2. a parent AND child tile both loaded mid-zoom, each holding the WHOLE
        //      building at a different simplification         -> bboxes nearly coincide
        //      -> keep only the finer one, or the two z-fight
        // The old way-id dedupe hid case 2 by only ever keeping one fragment; now that
        // case 1 is honoured, case 2 has to be rejected explicitly.
        let dup = -1;
        for (let i = 0; i < list.length; i++) {
          const o = list[i].bb;
          const ow = Math.max(0, Math.min(bb.e, o.e) - Math.max(bb.w, o.w));
          const oh = Math.max(0, Math.min(bb.n, o.n) - Math.max(bb.s, o.s));
          if ((ow * oh) / Math.min(bb.area, o.area) > 0.6) { dup = i; break; }
        }
        if (dup >= 0) {
          if (nv > list[dup].nv) list[dup] = { sig, polysIn, p, bb, nv };  // finer wins
          continue;
        }
        list.push({ sig, polysIn, p, bb, nv });
      }

      const keys = [], items = [], transfer = [];
      // detailed buildings (roof/colour) first so they always survive the cap
      const groups = [...frag.values()].sort((a, b) =>
        ((b[0].p.roof_shape || b[0].p.colour) ? 1 : 0) - ((a[0].p.roof_shape || a[0].p.colour) ? 1 : 0));
      let n = 0;
      for (const list of groups) {
        const p0 = list[0].p;
        if (n >= BLDG_MAX && !(p0.roof_shape || p0.colour)) continue;
        n++;
        // A clipped fragment's bounding rectangle is NOT the building's: half a
        // rectangle is still a rectangle, so the rect-fill guard would happily raise
        // a gable across the half. Once a building is split we no longer know its
        // real outline, so it goes flat.
        const clipped = list.length > 1;
        for (const fr of list) {
          const key = fr.p.osm_type + "/" + fr.p.osm_way_id + "#" + fr.sig;
          keys.push(key);
          if (bldgCache.has(key)) continue;    // already tessellated — the whole point
          const polys = [];
          for (const poly of fr.polysIn) {
            const rings = [];
            for (const r of poly) {
              const flat = new Float64Array(r.length * 2);
              for (let i = 0; i < r.length; i++) {
                const m = MC.fromLngLat({ lng: r[i][0], lat: r[i][1] }, 0);
                flat[i * 2] = m.x - BLDG_ORIGIN.x; flat[i * 2 + 1] = m.y - BLDG_ORIGIN.y;
              }
              rings.push(flat); transfer.push(flat.buffer);
            }
            polys.push(rings);
          }
          const wp = bldgWorkerProps(fr.p);
          if (clipped) delete wp.roof_shape;
          items.push({ key, polys, p: wp });
        }
      }

      if (items.length) {
        const done = await tessellateBuildings(items, transfer);
        for (const r of done) if (r.pos.length) bldgCache.set(r.key, r);
      }
      // a newer build started while we were awaiting — let that one win
      if (tok !== bldgBuildToken) return "unchanged";

      let total = 0;
      for (const k of keys) { const g = bldgCache.get(k); if (g) total += g.pos.length; }
      if (!total) return null;
      const pos = new Float32Array(total), col = new Float32Array(total), nrm = new Float32Array(total);
      let o = 0;
      for (const k of keys) {
        const g = bldgCache.get(k); if (!g) continue;
        pos.set(g.pos, o); col.set(g.col, o); nrm.set(g.nrm, o); o += g.pos.length;
      }
      // bound the cache: once past the cap, drop everything not currently in view
      if (bldgCache.size > BLDG_CACHE_MAX) {
        const live = new Set(keys);
        for (const k of bldgCache.keys()) if (!live.has(k)) bldgCache.delete(k);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
      geo.setAttribute("normal", new THREE.BufferAttribute(nrm, 3));
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0.05, side: THREE.DoubleSide }));
      mesh.userData.origin = BLDG_ORIGIN;
      return mesh;
    };
    const bldgLayer = {
      id: "buildings-3d-mesh", type: "custom", renderingMode: "3d",
      onAdd(m, gl) {
        this.camera = new THREE.Camera(); this.scene = new THREE.Scene();
        // EXPOSURE, not taste. The old rig summed to 1.75 (0.9 ambient + 0.6 + 0.25),
        // which on an up-facing roof lands at ~1.51x albedo — and every one of the six
        // earth tones then clips at least one channel, so all roofs washed toward
        // white and Ultra lost the tonal variation that 3D mode shows. MapLibre's
        // fill-extrusion (3D mode) shades analytically from light.intensity 0.4 and
        // never outputs brighter than the albedo, so Ultra has to stay at or below
        // 1.0x to sit in the same tonal range. 0.55 + 0.45*0.79 + 0.12*0.55 ~= 0.97.
        // Raising these is what makes the two modes disagree — check the arithmetic
        // before touching them.
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.45); d1.position.set(0.5, -0.7, 1.1); this.scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xdfe8ff, 0.12); d2.position.set(-0.6, 0.4, 0.5); this.scene.add(d2);
        this.renderer = navRenderer(m, gl); this.rebuild();
      },
      rebuild() {
        if (!this.scene) return;
        // async now: tessellation happens in the worker, so the swap lands on a later
        // tick. Guard on this.scene again — the layer can be removed while we wait.
        buildBuildingsMesh().then((next) => {
          if (next === "unchanged" || !this.scene) return;
          if (this.mesh) { this.scene.remove(this.mesh); this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.mesh = null; }
          this.mesh = next; if (next) this.scene.add(next);
          map.triggerRepaint();
        }).catch((err) => console.warn("[bldg] rebuild failed:", err));
      },
      render(gl, matrix) {
        if (!this.mesh || !bldgVisible || !MODES[viewMode].mesh) return; // Ultra only
        const mArr = Array.isArray(matrix) ? matrix
          : (matrix && matrix.defaultProjectionData ? matrix.defaultProjectionData.mainMatrix : matrix && matrix.mainMatrix);
        if (!mArr) return;
        const o = this.mesh.userData.origin;
        this.camera.projectionMatrix = new THREE.Matrix4().fromArray(mArr).multiply(new THREE.Matrix4().makeTranslation(o.x, o.y, o.z));
        this.renderer.resetState(); this.renderer.render(this.scene, this.camera);
      },
    };
    let bldgAdded = false, bldgTimer = null;
    const addBldgLayer = () => { if (bldgAdded || typeof THREE === "undefined") return; try { map.addLayer(bldgLayer); bldgAdded = true; } catch (_) {} };
    const scheduleBldgRebuild = () => {
      if (bldgTimer) clearTimeout(bldgTimer);
      bldgTimer = setTimeout(() => {
        bldgTimer = null;
        if (bldgAdded && MODES[viewMode].mesh) bldgLayer.rebuild();
      }, 140);
    };
    // Called by setViewMode after every mode change. Entering Ultra builds the mesh;
    // leaving it drops the geometry so the tessellated city isn't held in memory (and
    // isn't stale when you come back to a different part of town).
    window._syncModeLayers = () => {
      if (!bldgAdded) return;
      if (MODES[viewMode].mesh) scheduleBldgRebuild();
      else if (bldgLayer.mesh) {
        bldgLayer.scene.remove(bldgLayer.mesh);
        bldgLayer.mesh.geometry.dispose(); bldgLayer.mesh.material.dispose();
        bldgLayer.mesh = null;
        // clear the signature too: without this, re-entering Ultra over the same
        // features would match the old hash, skip the rebuild, and leave NO mesh.
        lastMeshSig = null;
        map.triggerRepaint();
      }
    };
    // recolour with the theme (rebuild regenerates vertex colours for day/night)
    window._setBldgTheme = (dark) => { bldgDark = dark; if (bldgAdded && MODES[viewMode].mesh) scheduleBldgRebuild(); };

    // Custom layer: renders the car group into MapLibre's context each frame,
    // georeferenced from DRIVE.carPos/carHeading. Added once, then shown/hidden.
    const carLayer = {
      id: "drive-car-3d", type: "custom", renderingMode: "3d",
      onAdd(map, gl) {
        this.camera = new THREE.Camera();
        this.scene = new THREE.Scene();
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(0.6, 1.4, 0.8);
        this.scene.add(key);
        const fill = new THREE.DirectionalLight(0xbcd0ff, 0.35); fill.position.set(-0.7, 0.6, -0.5);
        this.scene.add(fill);
        this.car = buildCarMesh(); this.car.visible = false;
        this.scene.add(this.car);
        this.renderer = navRenderer(map, gl);
      },
      render(gl, matrix) {
        if (!DRIVE.carPos || !this.car) return;
        // v4 passes the mercator matrix as an array; v5 may pass a projection object
        const mArr = Array.isArray(matrix) ? matrix
          : (matrix && matrix.defaultProjectionData ? matrix.defaultProjectionData.mainMatrix : matrix && matrix.mainMatrix);
        if (!mArr) return;
        const c = maplibregl.MercatorCoordinate.fromLngLat({ lng: DRIVE.carPos[0], lat: DRIVE.carPos[1] }, DRIVE.carZ || 0);
        const s = c.meterInMercatorCoordinateUnits();
        // yaw the car about its local (Y-up) vertical: heading 0=N, 90=E (see derivation)
        this.car.rotation.y = Math.PI - DRIVE.carHeading * Math.PI / 180;
        const l = new THREE.Matrix4()
          .makeTranslation(c.x, c.y, c.z)
          .scale(new THREE.Vector3(s, -s, s))
          .multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2)); // Y-up model → map Z-up
        this.camera.projectionMatrix = new THREE.Matrix4().fromArray(mArr).multiply(l);
        this.renderer.resetState();
        // clear the depth buffer first so the car is never occluded by the elevated
        // deck (it sits at the same z as the deck top on a bridge); the car is the
        // focus of the follow-cam, so it should always draw on top.
        this.renderer.clearDepth();
        this.renderer.render(this.scene, this.camera);
      },
    };

    // On the ground the flat MapLibre route line looks best (and hides under opaque
    // decks where the route is elevated). So we only draw a 3D ribbon for the ELEVATED
    // stretches of the route — the parts that ride a bridge/ramp deck, where a flat
    // line would sink out of sight. ELEV_MIN keeps ground roads on the flat line.
    const ELEV_MIN = 0.25; // metres — the ribbon takes over as soon as the route starts
                           // to rise, so it climbs the WHOLE ramp from near ground level
                           // and meets the flat line with no vertical gap (a higher
                           // threshold left the lower ramp flat and the ribbon jumping
                           // in ~2 m up). Flat roads sit at z=0 → still the flat line.
    // Split a [lng,lat,z] polyline into GROUND runs (z<ELEV_MIN) and ELEVATED runs
    // (z>=ELEV_MIN), sharing the transition vertex so the two meet. The flat MapLibre
    // line draws the ground runs; the 3D ribbon draws the elevated runs — so on a
    // bridge the route RISES (ribbon) instead of a flat line sitting on the ground
    // under the deck, and ground stretches keep the clean flat line (no floating bar).
    const splitByElevation = (coordsZ) => {
      const ground = [], elevated = []; let cur = null, curHi = null;
      for (let i = 0; i < (coordsZ ? coordsZ.length : 0); i++) {
        const hi = (coordsZ[i][2] || 0) >= ELEV_MIN;
        if (cur === null || hi !== curHi) {
          cur = []; curHi = hi;
          if (i > 0) cur.push(coordsZ[i - 1]); // shared transition vertex
          (hi ? elevated : ground).push(cur);
        }
        cur.push(coordsZ[i]);
      }
      return { ground: ground.filter((r) => r.length >= 2), elevated: elevated.filter((r) => r.length >= 2) };
    };
    // A flat ribbon along one or more [lng,lat,z] polylines, hugging the deck surface
    // (`lift` just clears z-fighting). Vertices are relative to a shared origin.
    const buildRouteRibbon = (runs, halfWm, color, liftM, origin, meterUnit) => {
      const M = maplibregl.MercatorCoordinate, hw = halfWm * meterUnit, pos = [];
      for (const coordsZ of runs) {
        if (!coordsZ || coordsZ.length < 2) continue;
        const mc = coordsZ.map((c) => {
          const m = M.fromLngLat({ lng: c[0], lat: c[1] }, (c[2] || 0) + liftM);
          return [m.x - origin.x, m.y - origin.y, m.z - origin.z];
        });
        const left = [], right = [];
        for (let i = 0; i < mc.length; i++) {
          const a = mc[Math.max(0, i - 1)], b = mc[Math.min(mc.length - 1, i + 1)];
          let dx = b[0] - a[0], dy = b[1] - a[1]; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
          const px = -dy * hw, py = dx * hw;
          left.push([mc[i][0] + px, mc[i][1] + py, mc[i][2]]);
          right.push([mc[i][0] - px, mc[i][1] - py, mc[i][2]]);
        }
        for (let i = 0; i < mc.length - 1; i++) {
          const l0 = left[i], r0 = right[i], l1 = left[i + 1], r1 = right[i + 1];
          pos.push(l0[0], l0[1], l0[2], r0[0], r0[1], r0[2], r1[0], r1[1], r1[2]);
          pos.push(l0[0], l0[1], l0[2], r1[0], r1[1], r1[2], l1[0], l1[1], l1[2]);
        }
      }
      if (!pos.length) return null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
    };

    // Custom layer holding the elevated route + turn ribbons. Rebuilt each frame from
    // the current remaining-route slice (only the elevated runs, only in 3D drive).
    const driveRouteLayer = {
      id: "drive-route-3d", type: "custom", renderingMode: "3d",
      onAdd(m, gl) {
        this.camera = new THREE.Camera(); this.scene = new THREE.Scene();
        this.renderer = navRenderer(m, gl);
        this.meshes = {}; this.origin = null; this.meterUnit = 1;
      },
      _set(key, coordsZ, halfWm, color, liftM) {
        if (this.meshes[key]) { this.scene.remove(this.meshes[key]); this.meshes[key].geometry.dispose(); this.meshes[key] = null; }
        const mesh = buildRouteRibbon(coordsZ, halfWm, color, liftM, this.origin, this.meterUnit);
        if (mesh) { this.meshes[key] = mesh; this.scene.add(mesh); }
      },
      update(routeRuns, turnRuns) {
        if (!this.scene) return;
        const c0 = map.getCenter();
        this.origin = maplibregl.MercatorCoordinate.fromLngLat({ lng: c0.lng, lat: c0.lat }, 0);
        this.meterUnit = this.origin.meterInMercatorCoordinateUnits();
        this._set("route", routeRuns, 1.5, 0x2f6bd6, 0.08);
        this._set("turn", turnRuns, 1.9, 0xf5c518, 0.16);
      },
      clear() { if (!this.scene) return; for (const k in this.meshes) if (this.meshes[k]) { this.scene.remove(this.meshes[k]); this.meshes[k].geometry.dispose(); this.meshes[k] = null; } },
      render(gl, matrix) {
        if (!this.scene || !this.origin) return;
        const mArr = Array.isArray(matrix) ? matrix
          : (matrix && matrix.defaultProjectionData ? matrix.defaultProjectionData.mainMatrix : matrix && matrix.mainMatrix);
        if (!mArr) return;
        const o = this.origin;
        this.camera.projectionMatrix = new THREE.Matrix4().fromArray(mArr)
          .multiply(new THREE.Matrix4().makeTranslation(o.x, o.y, o.z));
        this.renderer.resetState();
        this.renderer.render(this.scene, this.camera);
      },
    };
    let driveRouteAdded = false;
    const addDriveRouteLayer = () => {
      if (driveRouteAdded || typeof THREE === "undefined") return;
      try { map.addLayer(driveRouteLayer); driveRouteAdded = true; } catch (_) {}
    };

    // Route renderer for BOTH the planning preview AND drive. In 3D the route is SPLIT
    // by elevation (splitByElevation): ground runs (z<ELEV_MIN) draw as the flat
    // MapLibre line — keeping its casing + turn arrows — while elevated runs (bridge/
    // ramp decks) draw as the sloped three.js ribbon so they ride the deck instead of
    // sinking under it. They share the transition vertex, so the two meet at the ramp
    // foot with no visible gap. In 2D the whole route is the flat MapLibre line and the
    // ribbon is cleared. routeZ / turnZ are [lng,lat,z] polylines (or null). Called with
    // the full route in preview and the trimmed remaining route each frame in drive.
    const lineFeat = (cz) => ({ type: "Feature", geometry: { type: "MultiLineString", coordinates: cz.map((c) => [c[0], c[1]]) } });
    const showNavRoute = (routeZ, turnZ, is3D) => {
      const use3D = is3D && driveRouteAdded && driveRouteLayer.scene;
      
      const routeSplit = use3D ? splitByElevation(routeZ) : { ground: [routeZ].filter(Boolean), elevated: [] };
      const turnSplit  = use3D ? splitByElevation(turnZ)  : { ground: [turnZ].filter(Boolean), elevated: [] };

      // Ground pieces go to the MapLibre geojson layer
      const rsrc = map.getSource("nav-route"), tsrc = map.getSource("nav-turn");
      if (rsrc) rsrc.setData(routeSplit.ground.length ? { type: "Feature", geometry: { type: "MultiLineString", coordinates: routeSplit.ground.map(r => r.map(c => [c[0], c[1]])) } } : emptyFC);
      if (tsrc) tsrc.setData(turnSplit.ground.length ? { type: "Feature", geometry: { type: "MultiLineString", coordinates: turnSplit.ground.map(r => r.map(c => [c[0], c[1]])) } } : emptyFC);

      // Elevated pieces go to the Three.js ribbon layer
      if (use3D) {
        driveRouteLayer.update(routeSplit.elevated, turnSplit.elevated);
      } else {
        driveRouteLayer.clear();
      }

      // Always keep the MapLibre flat line layers visible for the ground segments
      for (const id of ["nav-route-core", "nav-route-casing", "nav-turn"])
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "visible");
    };
    // draw NAV.lastRoute as a static preview (planning), in the current main-view mode
    const showPreviewRoute = () => {
      // preview exists ONLY with a computed route from BOTH a start and an end point;
      // never during an active drive (the tick owns the route then)
      if (!NAV.lastRoute || NAV.points.length < 2 || DRIVE.active) return;
      const r = NAV.lastRoute;
      const cz = r.coords.map((c, i) => [c[0], c[1], (r.zs && r.zs[i]) || 0]);
      showNavRoute(cz, null, is3d);
    };
    window._showPreviewRoute = showPreviewRoute; // called from setMode (defined earlier)

    let carLayerAdded = false;
    const setupCarLayer = (pos, heading) => {
      DRIVE.carPos = pos; DRIVE.carHeading = heading;
      if (typeof THREE === "undefined") return; // three.js failed to load → skip the car, drive still works
      addDriveRouteLayer(); // ensure the route ribbon layer exists (also added at load)
      if (!carLayerAdded) {
        // order: decks + route ribbon (added at load) → car on top
        map.addLayer(carLayer);
        carLayerAdded = true;
      }
      if (carLayer.car) carLayer.car.visible = true;
    };
    const hideForDrive = (on) => {
      for (const id of ["controls", "legend", "readout", "search", "nav-summary"]) {
        const el = document.getElementById(id); if (el) el.style.display = on ? "none" : "";
      }
    };

    const DRIVE = { active: false, raf: 0, paused: false, d: 0, total: 0, timeS: 0, carPos: null, carHeading: 0, carZ: 0, last: 0, lastGuide: 0, mode: "3d", curSpeed: 0 };

    // 2D flat car marker (a DOM arrow) — used instead of the three.js mesh when the
    // driver flips to 2D nav mode during the trip.
    let car2d = null;
    const ensureCar2d = () => {
      if (!car2d) {
        const el = document.createElement("div"); el.className = "car2d";
        // bold blue nav chevron with a white outline + halo — high contrast on both
        // the light and dark basemaps (the old green-on-dark arrow was hard to see)
        el.innerHTML =
          '<svg width="48" height="48" viewBox="0 0 48 48">' +
          '<circle cx="24" cy="24" r="22" fill="rgba(47,107,214,0.22)"/>' +
          '<path d="M24 5 L38 41 L24 32 L10 41 Z" fill="#2f6bd6" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>' +
          '</svg>';
        car2d = new maplibregl.Marker({ element: el, rotationAlignment: "map", anchor: "center" });
      }
      return car2d;
    };
    // Switch the follow-cam between 3D (mesh) and 2D (flat marker) live, mid-trip.
    const setDriveMode = (mode) => {
      DRIVE.mode = mode;
      const b = document.getElementById("drive-bottom").querySelector(".mode");
      if (b) b.textContent = mode === "3d" ? "3D" : "2D"; // shows the CURRENT view (tap toggles)
      if (carLayer.car) carLayer.car.visible = (mode === "3d") && DRIVE.active;
      if (mode === "2d") { if (DRIVE.carPos) ensureCar2d().setLngLat(DRIVE.carPos).setRotation(DRIVE.carHeading).addTo(map); }
      else if (car2d) car2d.remove();
      // the drive tick's showNavRoute() switches the route between flat line (2D) and
      // 3D ribbon (3D) + toggles layer visibility each frame, so nothing to do here.
      map.triggerRepaint();
    };

    // exterior ring of a lane polygon (used to dedupe queried lane features)
    const ringOf = (g) => g.type === "Polygon" ? g.coordinates[0] : g.type === "MultiPolygon" ? g.coordinates[0][0] : null;

    const clearLaneGuide = () => { const s = map.getSource("lane-guide"); if (s) s.setData({ type: "FeatureCollection", features: [] }); };
    // `winWays` = [{w, dir}] for the current way + one ahead. A lane is highlighted
    // iff its osm_way_ids contains one of those ways AND its direction matches our
    // travel — exact, so no cross-street / oncoming / parallel-road false positives.
    const updateLaneGuide = (pos, winWays) => {
      const src = map.getSource("lane-guide");
      if (!src || !winWays || !winWays.length) return;
      const p = map.project(pos);
      // narrow, forward-only box: hugs the car's own driving lane(s) AHEAD (screen
      // up = travel direction), so it no longer paints the full carriageway, the
      // oncoming side, or the stretch behind the car.
      const box = [[p.x - 80, p.y - 260], [p.x + 80, p.y + 20]];
      let feats = [];
      try { feats = map.queryRenderedFeatures(box, { layers: ["lanes"] }); } catch (_) {}
      const seen = new Set(), out = [];
      for (const f of feats) {
        const pr = f.properties || {};
        if (pr.type !== "Driving") continue;
        const ids = String(pr.osm_way_ids).match(/\d+/g);
        if (!ids) continue;
        if (!winWays.some((ww) => ww.dir === pr.direction && ids.includes(ww.w))) continue;
        const ring = ringOf(f.geometry);
        const key = ring ? `${ring[0][0].toFixed(5)},${ring[0][1].toFixed(5)}` : String(out.length);
        if (seen.has(key)) continue; seen.add(key);
        out.push({ type: "Feature", geometry: f.geometry, properties: {} });
      }
      src.setData({ type: "FeatureCollection", features: out });
    };

    const stopDrive = () => {
      DRIVE.active = false;
      if (DRIVE.raf) cancelAnimationFrame(DRIVE.raf);
      // hide (don't remove) the 3D car layer so its single WebGL renderer is reused
      DRIVE.carPos = null;
      if (carLayer.car) carLayer.car.visible = false;
      if (car2d) car2d.remove();
      if (carLayerAdded) map.triggerRepaint(); // clear the last car frame
      clearLaneGuide();
      if (map.getSource("nav-turn")) map.getSource("nav-turn").setData(emptyFC); // drop the yellow turn overlay
      if (map.getSource("nav-turn")) map.getSource("nav-turn").setData(emptyFC);
      driveUI.classList.remove("on");
      hideForDrive(false);
      togglePanel(true);
      // restore the full-route PREVIEW in the current main-view mode (unified renderer
      // handles flat-vs-ribbon + layer visibility); DRIVE.active already false above
      showPreviewRoute();
      if (NAV.lastRoute) { navSummary.classList.add("on"); fitRoute(NAV.lastRoute.coords); }
    };

    const startDrive = (r) => {
      if (!r || !r.coords || r.coords.length < 2) return;
      // drive the lane-offset path (car + camera + drawn route all follow it, so
      // they stay consistent). Planning view keeps the centerline.
      const pts = offsetRight(r.coords, LANE_OFFSET_M), cum = [0];
      for (let i = 1; i < pts.length; i++) cum[i] = cum[i - 1] + metersBetween(pts[i - 1], pts[i]);
      const total = cum[cum.length - 1] || 1;
      // per-vertex altitude, aligned to pts (offsetRight preserves vertex count)
      const zs = (r.zs && r.zs.length === pts.length) ? r.zs : pts.map(() => 0);
      // altitude sampler (metres) at distance d — linear interp along the profile
      const zAt = (d) => {
        let i = 0; while (i < pts.length - 2 && cum[i + 1] < d) i++;
        const segLen = (cum[i + 1] - cum[i]) || 1;
        const t = Math.max(0, Math.min(1, (d - cum[i]) / segLen));
        return zs[i] + (zs[i + 1] - zs[i]) * t;
      };
      const mans = r.maneuvers, turnAt = []; let acc = 0;
      for (let i = 0; i < mans.length; i++) { turnAt[i] = acc; acc += mans[i].dist || 0; }
      // way-runs: merge consecutive legs sharing (way, dir) into distance ranges,
      // so the lane highlight can cover the current way + exactly one ahead
      const runs = []; let racc = 0;
      for (const lw of (r.legWays || [])) {
        const last = runs[runs.length - 1];
        if (last && last.w === lw.w && last.dir === lw.dir) last.end += lw.len;
        else runs.push({ w: lw.w, dir: lw.dir, start: racc, end: racc + lw.len });
        racc += lw.len;
      }
      let segIdx = 0, manPtr = 1, runPtr = 0;
      // all three pointers reset when d moves backwards (e.g. the ↺ restart) so the
      // walk never gets stuck at the end of the route.
      const curRun = (d) => { if (runPtr && d < runs[runPtr].start) runPtr = 0;
        while (runPtr < runs.length - 1 && d >= runs[runPtr].end) runPtr++; return runPtr; };
      // pure position sampler (does NOT move segIdx) — safe to call for arbitrary d
      const posAt = (d) => {
        let i = 0; while (i < pts.length - 2 && cum[i + 1] < d) i++;
        const a = pts[i], b = pts[i + 1], segLen = (cum[i + 1] - cum[i]) || 1;
        const t = Math.max(0, Math.min(1, (d - cum[i]) / segLen));
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      };
      const sampleAt = (d) => {
        if (d < cum[segIdx]) segIdx = 0;
        while (segIdx < pts.length - 2 && cum[segIdx + 1] < d) segIdx++;
        const a = pts[segIdx], b = pts[segIdx + 1], segLen = (cum[segIdx + 1] - cum[segIdx]) || 1;
        const t = Math.max(0, Math.min(1, (d - cum[segIdx]) / segLen));
        return { pos: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], heading: bearingDeg(a, b) };
      };
      // slice the route polyline between two distances (for the yellow turn stretch)
      const sliceRoute = (d0, d1) => {
        if (d1 - d0 < 1) return null;
        const out = [posAt(d0)];
        for (let i = 0; i < pts.length; i++) if (cum[i] > d0 && cum[i] < d1) out.push(pts[i]);
        out.push(posAt(d1));
        return out.length >= 2 ? out : null;
      };
      // same slice, but carrying altitude → [lng,lat,z] for the 3D route ribbon
      const sliceRouteZ = (d0, d1) => {
        if (d1 - d0 < 1) return null;
        const p0 = posAt(d0), p1 = posAt(d1);
        const out = [[p0[0], p0[1], zAt(d0)]];
        for (let i = 0; i < pts.length; i++) if (cum[i] > d0 && cum[i] < d1) out.push([pts[i][0], pts[i][1], zs[i]]);
        out.push([p1[0], p1[1], zAt(d1)]);
        return out.length >= 2 ? out : null;
      };
      const upcoming = (d) => { if (manPtr > 1 && d < turnAt[manPtr - 1]) manPtr = 1;
        while (manPtr < mans.length - 1 && d >= turnAt[manPtr]) manPtr++; return manPtr; };
      const updateHud = (mi) => {
        const man = mans[mi], isFinished = DRIVE.d >= total;
        dBanner.querySelector(".b-ic").textContent = TURN_GLYPH[man.turn] || "↑";
        dBanner.querySelector(".b-dist").textContent = fmtDist(Math.max(0, turnAt[mi] - DRIVE.d));
        dBanner.querySelector(".b-road").textContent = isFinished ? "Arrived at destination" : (man.name || (man.turn === "arrive" ? "Arrive at destination" : ""));
        // "Then <arrow>" — preview the maneuver after the upcoming one
        const then = mans[mi + 1], thenEl = dBanner.querySelector(".b-then");
        if (then && !isFinished) { dBanner.querySelector(".b-then-ic").textContent = TURN_GLYPH[then.turn] || "↑"; thenEl.classList.add("on"); }
        else thenEl.classList.remove("on");
        // speed cluster: current (eased) speed + posted limit of the road we're on
        dSpeedEl.textContent = isFinished ? "0" : Math.round(DRIVE.curSpeed * 3.6);
        const lim = mans[Math.max(0, mi - 1)].lim;
        dLimitEl.textContent = lim ? lim : "–";

        const remainT = Math.max(0, DRIVE.timeS * (1 - DRIVE.d / total));
        dBottom.querySelector(".remain").textContent = fmtDur(remainT);
        dBottom.querySelector(".dist").textContent = fmtDist(Math.max(0, total - DRIVE.d));
        dBottom.querySelector(".eta").textContent = isFinished ? "Arrived" : "Arrive ~" + clockAfter(remainT);
      };
      const tick = (ts) => {
        if (!DRIVE.active) return;
        if (!DRIVE.last) DRIVE.last = ts;
        let dt = (ts - DRIVE.last) / 1000; DRIVE.last = ts; if (dt > 0.1) dt = 0.1;
        const mi = upcoming(DRIVE.d);
        // cruise at the road's posted speed (so the speedometer sits near the limit),
        // falling back to the effective speed only if no posted value is known
        const cm = mans[Math.max(0, mi - 1)];
        const posted = cm.lim ? cm.lim / 3.6 : (cm.spd || 8);
        // slow into a real turn: scale down as we approach the next turning maneuver
        const isTurn = /left|right|uturn/.test(mans[mi] ? mans[mi].turn : "");
        const toTurn = turnAt[mi] - DRIVE.d;
        const slow = (isTurn && toTurn < TURN_SLOW_M)
          ? TURN_SLOW_MIN + (1 - TURN_SLOW_MIN) * Math.max(0, toTurn) / TURN_SLOW_M : 1;
        DRIVE.curSpeed = posted * slow;
        if (!DRIVE.paused) {
          DRIVE.d += DRIVE.curSpeed * PLAYBACK * dt;
          if (DRIVE.d > total) DRIVE.d = total;
        }
        const s = sampleAt(DRIVE.d);
        DRIVE.carPos = s.pos; DRIVE.carHeading = s.heading; DRIVE.carZ = zAt(DRIVE.d); // 3D car reads these in its render()
        // ease the camera bearing toward the heading so turns glide instead of snapping
        const diff = ((s.heading - DRIVE.camBearing + 540) % 360) - 180;
        DRIVE.camBearing = (DRIVE.camBearing + diff * Math.min(1, dt * TURN_EASE) + 360) % 360;
        const V = DRIVE_VIEW[DRIVE.mode];
        // The follow-cam targets the GROUND (z=0). On an elevated deck the car is ~carZ
        // up, which shifts it UP out of frame. Compensate by looking further AHEAD by
        // the elevation projected onto the ground (carZ / tan(elevation-angle)), so the
        // lifted car sits at the same screen position as a ground car. (2D/top-down:
        // no shift, so no compensation.)
        const elevLook = (V.pitch > 5 && (DRIVE.carZ || 0) > 0.1)
          ? DRIVE.carZ / Math.tan((90 - V.pitch) * Math.PI / 180) : 0;
        map.jumpTo({ center: moveAlong(s.pos, DRIVE.camBearing, V.look + elevLook), bearing: DRIVE.camBearing, pitch: V.pitch, zoom: V.zoom });
        if (DRIVE.mode === "2d" && car2d) car2d.setLngLat(s.pos).setRotation(s.heading);
        // show only the road AHEAD — trim to the remaining portion so the already-
        // driven stretch behind the car disappears (like real nav). yellow = a short
        // band AT the turn (last ~35 m into it), shown once the turn is within range.
        // trim to the road AHEAD (remaining route) + a short yellow turn band; the
        // SAME unified renderer as the preview (3D = sloped ribbon on the decks, 2D =
        // flat line), so preview and drive look identical.
        const TURN_BAND_M = 35;
        const nearTurn = mans[mi] && /left|right|uturn/.test(mans[mi].turn) && (turnAt[mi] - DRIVE.d) < 160;
        const turnD0 = Math.max(DRIVE.d, turnAt[mi] - TURN_BAND_M);
        showNavRoute(sliceRouteZ(DRIVE.d, total), nearTurn ? sliceRouteZ(turnD0, turnAt[mi]) : null, DRIVE.mode === "3d");
        if (ts - DRIVE.lastGuide > 180) { // throttle lane highlight; window = current way + one ahead
          DRIVE.lastGuide = ts;
          const rp = curRun(DRIVE.d);
          // only pre-light the NEXT way when we're close to it — otherwise a
          // diverging side road lights up green hundreds of metres early
          const nearNext = runs[rp] && (runs[rp].end - DRIVE.d) < 70;
          const winWays = [runs[rp], nearNext ? runs[rp + 1] : null].filter(Boolean).map((r) => ({ w: r.w, dir: r.dir }));
          updateLaneGuide(s.pos, winWays);
        }
        updateHud(mi);
        if (DRIVE.d >= total && !DRIVE.paused) { 
          DRIVE.paused = true; 
          dBottom.querySelector(".pause").textContent = "↺"; 
        }
        DRIVE.raf = requestAnimationFrame(tick);
      };

      const s0 = sampleAt(0);
      Object.assign(DRIVE, { active: true, paused: false, d: 0, total, timeS: r.timeS, last: 0, camBearing: s0.heading });
      hideForDrive(true);
      togglePanel(false); navStepsBtn.classList.remove("on"); navHint.classList.remove("on");
      driveUI.classList.add("on");
      dBottom.querySelector(".pause").textContent = "⏸";
      setupCarLayer(s0.pos, s0.heading);
      setDriveMode(is3d ? "3d" : "2d"); // launch in whatever mode the map is currently showing
      dBottom.querySelector(".theme").textContent = darkOn ? "☀️" : "🌙";
      const V0 = DRIVE_VIEW[DRIVE.mode];
      map.jumpTo({ center: moveAlong(s0.pos, s0.heading, V0.look), bearing: s0.heading, pitch: V0.pitch, zoom: V0.zoom });
      DRIVE.raf = requestAnimationFrame(tick);
    };

    dBottom.querySelector(".pause").onclick = () => {
      if (!DRIVE.active) return;
      DRIVE.last = 0;
      if (DRIVE.d >= DRIVE.total) {           // arrived → this button is "↺ restart"
        DRIVE.d = 0; DRIVE.paused = false;
        dBottom.querySelector(".pause").textContent = "⏸";
        return;
      }
      DRIVE.paused = !DRIVE.paused;
      dBottom.querySelector(".pause").textContent = DRIVE.paused ? "▶" : "⏸";
    };
    dBottom.querySelector(".exit").onclick = stopDrive;
    // switch 2D / 3D live during the trip
    dBottom.querySelector(".mode").onclick = () => setDriveMode(DRIVE.mode === "3d" ? "2d" : "3d");
    // switch day / night live during the trip (drives the same global theme)
    dBottom.querySelector(".theme").onclick = () => {
      btnDark.onclick();
      dBottom.querySelector(".theme").textContent = darkOn ? "☀️" : "🌙";
    };

    const computeRoute = () => {
      const [a, b] = NAV.points;
      const t0 = performance.now();
      const r = NAV.route(a.snap, b.snap);
      const ms = (performance.now() - t0).toFixed(1);
      if (!r) { navHint.textContent = "⚠ No route found between those points"; navSummary.classList.remove("on"); togglePanel(false); console.warn("[nav] no route"); return; }
      // route() already begins/ends exactly at the snapped points (partial edges)
      const coords = r.coords;
      ensureRouteLayer();
      NAV.lastRoute = r;
      showPreviewRoute(); // 3D = sloped ribbon on the decks, 2D = flat line (same as drive)
      showSummary(r);
      renderPanel(r);
      fitRoute(coords);
      navHint.textContent = "Click again to start over";
      console.log(`[nav] route: ${r.nodes} nodes, ${fmtDist(r.distM)}, ${fmtDur(r.timeS)}, A* in ${ms}ms`);
      console.log(`[nav] ${r.maneuvers.length} maneuvers:`);
      r.maneuvers.forEach((m, i) => console.log(`   ${i + 1}. ${m.instruction}${m.dist ? " — " + fmtDist(m.dist) : ""}`));
    };

    const SNAP_MAX_M = 150; // farther than this from any road = off the mapped network
    const placePoint = (lngLat) => {
      if (NAV.points.length >= 2) { resetNav(); return; } // guard: already have A+B
      const s = NAV.snap(lngLat.lng, lngLat.lat);
      if (s.distM > SNAP_MAX_M) {
        navHint.textContent = "⚠ No road near there — pick a point on the mapped area";
        return;
      }
      const label = NAV.points.length === 0 ? "A" : "B";
      const marker = new maplibregl.Marker({ element: makePin(label), anchor: "bottom" })
        .setLngLat([s.lng, s.lat]).addTo(map);
      NAV.points.push({ marker, snap: s });
      console.log(`[nav] ${label} snapped ${s.distM}m to edge #${s.e}, node #${s.node}`);
      if (NAV.points.length === 2) computeRoute(); else setHint();
    };

    let lastPick = 0;
    map.on("click", (e) => {
      if (!NAV.pickMode || !NAV.graph) return;
      const now = performance.now();
      if (now - lastPick < 350) return; // swallow the paired click of a dbl-click
      lastPick = now;
      if (NAV.points.length >= 2) { resetNav(); return; } // 3rd click resets
      placePoint(e.lngLat);
    });

    btnRoute.onclick = () => {
      NAV.pickMode = !NAV.pickMode;
      btnRoute.classList.toggle("on", NAV.pickMode);
      navHint.classList.toggle("on", NAV.pickMode);
      map.getCanvas().style.cursor = NAV.pickMode ? "crosshair" : "";
      if (NAV.pickMode) { NAV.ensureGraph().catch(() => {}); setHint(); }
      else { resetNav(); }
    };

    // one-time verification (Task 3) — load after the map goes idle so it can't
    // slow the first paint, then log a self-check. Remove once the UI drives loads.
    map.once("idle", () => {
      const t0 = performance.now();
      NAV.ensureGraph().then((g) => {
        const ms = (performance.now() - t0).toFixed(0);
        const dirEdges = [...NAV.adj.values()].reduce((s, a) => s + a.length, 0);
        // pick a node with the most neighbours as a sample lookup
        let sample = null, best = -1;
        for (const [n, a] of NAV.adj) if (a.length > best) { best = a.length; sample = n; }
        console.log(`[nav] graph loaded in ${ms}ms`);
        console.log(`[nav]   nodes=${g.meta.nodes} (adj has ${NAV.adj.size} with out-edges)`);
        console.log(`[nav]   edges=${g.meta.edges} -> ${dirEdges} directed adjacency entries`);
        console.log(`[nav]   classes=${g.classes.length}, names=${g.names.length}`);
        const [lng, lat] = NAV.nodeLngLat(sample);
        console.log(`[nav]   busiest node #${sample} @ ${lat.toFixed(5)},${lng.toFixed(5)} has ${best} neighbours:`,
          NAV.adj.get(sample).map((x) => `${g.classes[x.cls]}(${x.len}m)`));
      }).catch(() => {});
    });
  </script>
</body>
</html>
